
<!-- integrated_security_data_management_system_7053/frontend/auth.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>身份认证 - 一体化安全数据管理系统</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.loli.net/css?family=Noto+Sans+SC:400,500,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
        }
        .form-input:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5);
        }
        .tab-button.active {
            border-bottom: 2px solid #3b82f6;
            color: #3b82f6;
        }
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
    </style>
</head>
<body class="text-gray-100">
    <div id="particles-js"></div>
    
    <div class="container mx-auto px-4 py-12">
        <div class="max-w-md mx-auto bg-gray-800 bg-opacity-80 rounded-xl shadow-xl overflow-hidden">
            <div class="flex border-b border-gray-700">
                <button id="login-tab" class="flex-1 py-4 px-6 text-center font-medium tab-button active">登录</button>
                <button id="register-tab" class="flex-1 py-4 px-6 text-center font-medium tab-button">注册</button>
            </div>

            <!-- 登录表单 -->
            <div id="login-form" class="p-8">
                <h2 class="text-2xl font-bold mb-6 text-center">欢迎回来</h2>
                <div class="mb-4">
                    <label for="login-username" class="block text-sm font-medium mb-2">用户名</label>
                    <input type="text" id="login-username" class="w-full px-4 py-2 rounded-md bg-gray-700 border border-gray-600 form-input focus:outline-none focus:border-blue-500" placeholder="请输入用户名">
                </div>
                <div class="mb-6">
                    <label for="login-password" class="block text-sm font-medium mb-2">密码</label>
                    <input type="password" id="login-password" class="w-full px-4 py-2 rounded-md bg-gray-700 border border-gray-600 form-input focus:outline-none focus:border-blue-500" placeholder="请输入密码">
                </div>
                <div class="flex items-center mb-6">
                    <input type="checkbox" id="remember-me" class="mr-2">
                    <label for="remember-me" class="text-sm">记住我</label>
                </div>
                <button id="login-btn" class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 rounded-md font-medium transition">登录</button>
                <div id="login-error" class="mt-4 text-red-400 text-sm hidden"></div>
            </div>

            <!-- 注册表单 -->
            <div id="register-form" class="p-8 hidden">
                <h2 class="text-2xl font-bold mb-6 text-center">创建新账户</h2>
                <div class="mb-4">
                    <label for="register-username" class="block text-sm font-medium mb-2">用户名</label>
                    <input type="text" id="register-username" class="w-full px-4 py-2 rounded-md bg-gray-700 border border-gray-600 form-input focus:outline-none focus:border-blue-500" placeholder="请输入用户名">
                </div>
                <div class="mb-4">
                    <label for="register-email" class="block text-sm font-medium mb-2">邮箱</label>
                    <input type="email" id="register-email" class="w-full px-4 py-2 rounded-md bg-gray-700 border border-gray-600 form-input focus:outline-none focus:border-blue-500" placeholder="请输入邮箱">
                </div>
                <div class="mb-4">
                    <label for="register-password" class="block text-sm font-medium mb-2">密码</label>
                    <input type="password" id="register-password" class="w-full px-4 py-2 rounded-md bg-gray-700 border border-gray-600 form-input focus:outline-none focus:border-blue-500" placeholder="请输入密码">
                </div>
                <div class="mb-6">
                    <label for="register-confirm" class="block text-sm font-medium mb-2">确认密码</label>
                    <input type="password" id="register-confirm" class="w-full px-4 py-2 rounded-md bg-gray-700 border border-gray-600 form-input focus:outline-none focus:border-blue-500" placeholder="请再次输入密码">
                </div>
                <button id="register-btn" class="w-full py-2 px-4 bg-green-600 hover:bg-green-700 rounded-md font-medium transition">注册</button>
                <div id="register-error" class="mt-4 text-red-400 text-sm hidden"></div>
                <div id="register-success" class="mt-4 text-green-400 text-sm hidden"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 粒子效果初始化
            particlesJS('particles-js', {
                particles: {
                    number: { value: 60, density: { enable: true, value_area: 800 } },
                    color: { value: "#3b82f6" },
                    shape: { type: "circle" },
                    opacity: { value: 0.5, random: true },
                    size: { value: 3, random: true },
                    line_linked: { enable: true, distance: 150, color: "#3b82f6", opacity: 0.4, width: 1 },
                    move: { enable: true, speed: 2, direction: "none", random: true, straight: false, out_mode: "out" }
                },
                interactivity: {
                    detect_on: "canvas",
                    events: {
                        onhover: { enable: true, mode: "repulse" },
                        onclick: { enable: true, mode: "push" }
                    }
                }
            });

            // 切换登录/注册标签
            const loginTab = document.getElementById('login-tab');
            const registerTab = document.getElementById('register-tab');
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');

            loginTab.addEventListener('click', function() {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
            });

            registerTab.addEventListener('click', function() {
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                registerForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            });

            // 登录按钮事件
            document.getElementById('login-btn').addEventListener('click', function() {
                const username = document.getElementById('login-username').value.trim();
                const password = document.getElementById('login-password').value.trim();
                const rememberMe = document.getElementById('remember-me').checked;
                
                if (!username || !password) {
                    showLoginError('请输入用户名和密码');
                    return;
                }

                const users = JSON.parse(localStorage.getItem('users')) || [];
                const user = users.find(u => u.username === username && u.password === password);
                
                if (user) {
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    if (rememberMe) {
                        localStorage.setItem('rememberedUser', username);
                    }
                    window.location.href = 'index.html';
                } else {
                    showLoginError('用户名或密码错误');
                }
            });

            // 注册按钮事件
            document.getElementById('register-btn').addEventListener('click', function() {
                const username = document.getElementById('register-username').value.trim();
                const email = document.getElementById('register-email').value.trim();
                const password = document.getElementById('register-password').value.trim();
                const confirm = document.getElementById('register-confirm').value.trim();
                
                if (!username || !email || !password || !confirm) {
                    showRegisterError('请填写所有字段');
                    return;
                }
                
                if (password !== confirm) {
                    showRegisterError('两次输入的密码不一致');
                    return;
                }
                
                if (password.length < 6) {
                    showRegisterError('密码长度不能少于6位');
                    return;
                }

                const users = JSON.parse(localStorage.getItem('users')) || [];
                if (users.some(u => u.username === username)) {
                    showRegisterError('用户名已存在');
                    return;
                }

                const newUser = {
                    username,
                    email,
                    password,
                    role: 'user',
                    createdAt: new Date().toISOString()
                };
                
                users.push(newUser);
                localStorage.setItem('users', JSON.stringify(users));
                
                document.getElementById('register-error').classList.add('hidden');
                document.getElementById('register-success').textContent = '注册成功，请登录';
                document.getElementById('register-success').classList.remove('hidden');
                
                // 清空表单
                document.getElementById('register-username').value = '';
                document.getElementById('register-email').value = '';
                document.getElementById('register-password').value = '';
                document.getElementById('register-confirm').value = '';
                
                // 自动切换到登录标签页
                setTimeout(() => {
                    loginTab.click();
                }, 1500);
            });

            function showLoginError(message) {
                const errorEl = document.getElementById('login-error');
                errorEl.textContent = message;
                errorEl.classList.remove('hidden');
            }

            function showRegisterError(message) {
                const errorEl = document.getElementById('register-error');
                errorEl.textContent = message;
                errorEl.classList.remove('hidden');
                document.getElementById('register-success').classList.add('hidden');
            }

            // 检查是否有记住的用户
            const rememberedUser = localStorage.getItem('rememberedUser');
            if (rememberedUser) {
                document.getElementById('login-username').value = rememberedUser;
                document.getElementById('remember-me').checked = true;
            }
        });
    </script>
</body>
</html>
