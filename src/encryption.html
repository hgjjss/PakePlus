
<!-- integrated_security_data_management_system_7053/frontend/encryption.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>数据加密 - 一体化安全数据管理系统</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.loli.net/css?family=Noto+Sans+SC:400,500,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
        }
        .tab-button.active {
            border-bottom: 2px solid #3b82f6;
            color: #3b82f6;
        }
        .card-hover:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
        }
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .crypto-card {
            transition: all 0.3s ease;
        }
        .crypto-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body class="text-gray-100">
    <div id="particles-js"></div>
    
    <div class="container mx-auto px-4 py-8">
        <!-- 顶部导航栏 -->
        <header class="flex justify-between items-center mb-8">
            <div class="flex items-center">
                <button onclick="window.history.back()" class="mr-4 p-2 rounded-full hover:bg-gray-700 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </button>
                <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-600">
                    数据加密与脱敏
                </h1>
            </div>
            <div class="flex items-center space-x-4">
                <div class="relative">
                    <input type="text" id="search-input" placeholder="搜索密钥或算法..." class="px-4 py-2 bg-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 w-64">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 absolute right-3 top-2.5 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                    </svg>
                </div>
            </div>
        </header>

        <!-- 主内容区 -->
        <main>
            <!-- 加密功能选项卡 -->
            <div class="flex border-b border-gray-700 mb-8">
                <button id="encrypt-tab" class="px-6 py-3 font-medium tab-button active">数据加密</button>
                <button id="decrypt-tab" class="px-6 py-3 font-medium tab-button">数据解密</button>
                <button id="masking-tab" class="px-6 py-3 font-medium tab-button">数据脱敏</button>
                <button id="keys-tab" class="px-6 py-3 font-medium tab-button">密钥管理</button>
            </div>

            <!-- 加密功能区域 -->
            <div id="encrypt-section" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- 加密算法选择 -->
                <div class="lg:col-span-1 bg-gray-800 bg-opacity-70 rounded-xl p-6 shadow-lg">
                    <h2 class="text-xl font-bold mb-6">选择加密算法</h2>
                    <div class="space-y-4">
                        <div class="flex items-center">
                            <input id="aes-256" name="algorithm" type="radio" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-600" checked>
                            <label for="aes-256" class="ml-3 block text-sm font-medium">AES-256 (推荐)</label>
                        </div>
                        <div class="flex items-center">
                            <input id="aes-128" name="algorithm" type="radio" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-600">
                            <label for="aes-128" class="ml-3 block text-sm font-medium">AES-128</label>
                        </div>
                        <div class="flex items-center">
                            <input id="rsa-oaep" name="algorithm" type="radio" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-600">
                            <label for="rsa-oaep" class="ml-3 block text-sm font-medium">RSA-OAEP</label>
                        </div>
                        <div class="flex items-center">
                            <input id="ecdsa" name="algorithm" type="radio" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-600">
                            <label for="ecdsa" class="ml-3 block text-sm font-medium">ECDSA</label>
                        </div>
                    </div>

                    <div class="mt-8">
                        <h2 class="text-xl font-bold mb-4">加密选项</h2>
                        <div class="space-y-3">
                            <div class="flex items-center">
                                <input id="compress" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-600">
                                <label for="compress" class="ml-3 block text-sm font-medium">压缩后加密</label>
                            </div>
                            <div class="flex items-center">
                                <input id="add-timestamp" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-600" checked>
                                <label for="add-timestamp" class="ml-3 block text-sm font-medium">添加时间戳</label>
                            </div>
                            <div class="flex items-center">
                                <input id="add-signature" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-600">
                                <label for="add-signature" class="ml-3 block text-sm font-medium">添加数字签名</label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 加密操作区 -->
                <div class="lg:col-span-2 bg-gray-800 bg-opacity-70 rounded-xl p-6 shadow-lg">
                    <div class="mb-6">
                        <label for="encrypt-input" class="block text-sm font-medium mb-2">输入待加密数据</label>
                        <textarea id="encrypt-input" rows="8" class="w-full px-4 py-2 rounded-md bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500" placeholder="在此输入需要加密的文本内容..."></textarea>
                    </div>
                    <div class="flex justify-between">
                        <div class="flex items-center">
                            <label for="encrypt-key" class="block text-sm font-medium mr-2">加密密钥:</label>
                            <select id="encrypt-key" class="px-4 py-2 rounded-md bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500">
                                <option value="">选择密钥</option>
                                <option value="key1">主加密密钥 (AES-256)</option>
                                <option value="key2">备份密钥 (AES-256)</option>
                                <option value="key3">临时密钥 (AES-128)</option>
                            </select>
                        </div>
                        <button id="encrypt-btn" class="px-6 py-2 bg-blue-600 rounded-md hover:bg-blue-700 transition flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
                            </svg>
                            加密数据
                        </button>
                    </div>

                    <div class="mt-8">
                        <label for="encrypt-output" class="block text-sm font-medium mb-2">加密结果</label>
                        <textarea id="encrypt-output" rows="8" class="w-full px-4 py-2 rounded-md bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500" placeholder="加密后的数据将显示在这里..." readonly></textarea>
                        <div class="flex justify-end mt-2">
                            <button id="copy-encrypt" class="px-4 py-1 bg-gray-700 rounded-md hover:bg-gray-600 transition flex items-center text-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" />
                                    <path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z" />
                                </svg>
                                复制结果
                            </button>
                            <button id="save-encrypt" class="ml-2 px-4 py-1 bg-blue-600 rounded-md hover:bg-blue-700 transition flex items-center text-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                                </svg>
                                保存到文件
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 解密功能区域 (默认隐藏) -->
            <div id="decrypt-section" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- 解密选项 -->
                <div class="lg:col-span-1 bg-gray-800 bg-opacity-70 rounded-xl p-6 shadow-lg">
                    <h2 class="text-xl font-bold mb-6">解密设置</h2>
                    <div class="space-y-4">
                        <div>
                            <label for="decrypt-algorithm" class="block text-sm font-medium mb-2">算法自动检测</label>
                            <select id="decrypt-algorithm" class="w-full px-4 py-2 rounded-md bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500">
                                <option value="auto">自动检测 (推荐)</option>
                                <option value="aes-256">AES-256</option>
                                <option value="aes-128">AES-128</option>
                                <option value="rsa-oaep">RSA-OAEP</option>
                            </select>
                        </div>
                        <div class="flex items-center">
                            <input id="verify-signature" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-600">
                            <label for="verify-signature" class="ml-3 block text-sm font-medium">验证数字签名</label>
                        </div>
                        <div class="flex items-center">
                            <input id="check-timestamp" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-600" checked>
                            <label for="check-timestamp" class="ml-3 block text-sm font-medium">检查时间戳</label>
                        </div>
                    </div>
                </div>

                <!-- 解密操作区 -->
                <div class="lg:col-span-2 bg-gray-800 bg-opacity-70 rounded-xl p-6 shadow-lg">
                    <div class="mb-6">
                        <label for="decrypt-input" class="block text-sm font-medium mb-2">输入加密数据</label>
                        <textarea id="decrypt-input" rows="8" class="w-full px-4 py-2 rounded-md bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500" placeholder="在此输入需要解密的文本内容..."></textarea>
                    </div>
                    <div class="flex justify-between">
                        <div class="flex items-center">
                            <label for="decrypt-key" class="block text-sm font-medium mr-2">解密密钥:</label>
                            <select id="decrypt-key" class="px-4 py-2 rounded-md bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500">
                                <option value="">选择密钥</option>
                                <option value="key1">主加密密钥 (AES-256)</option>
                                <option value="key2">备份密钥 (AES-256)</option>
                                <option value="key3">临时密钥 (AES-128)</option>
                            </select>
                        </div>
                        <button id="decrypt-btn" class="px-6 py-2 bg-green-600 rounded-md hover:bg-green-700 transition flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M18 8a6 6 0 01-6 6h-1v4H9v-4H7a6 6 0 110-12h10a2 2 0 012 2v8zM6 12h8v2H6v-2z" clip-rule="evenodd" />
                            </svg>
                            解密数据
                        </button>
                    </div>

                    <div class="mt-8">
                        <label for="decrypt-output" class="block text-sm font-medium mb-2">解密结果</label>
                        <textarea id="decrypt-output" rows="8" class="w-full px-4 py-2 rounded-md bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500" placeholder="解密后的数据将显示在这里..." readonly></textarea>
                        <div class="flex justify-end mt-2">
                            <button id="copy-decrypt" class="px-4 py-1 bg-gray-700 rounded-md hover:bg-gray-600 transition flex items-center text-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" viewBox="0 0 20 20" fill="currentColor">
                                    <path d="M8 3a1 1 0 011-1h2a1 1 0 110 2H9a1 1 0 01-1-1z" />
                                    <path d="M6 3a2 2 0 00-2 2v11a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2 3 3 0 01-3 3H9a3 3 0 01-3-3z" />
                                </svg>
                                复制结果
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 数据脱敏区域 (默认隐藏) -->
            <div id="masking-section" class="hidden">
                <div class="bg-gray-800 bg-opacity-70 rounded-xl p-6 shadow-lg">
                    <h2 class="text-xl font-bold mb-6">数据脱敏配置</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label for="masking-pattern" class="block text-sm font-medium mb-2">脱敏模式</label>
                            <select id="masking-pattern" class="w-full px-4 py-2 rounded-md bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500">
                                <option value="full">完全脱敏 (*****)</option>
                                <option value="partial">部分脱敏 (保留首尾)</option>
                                <option value="hash">哈希脱敏</option>
                                <option value="random">随机替换</option>
                            </select>
                        </div>
                        <div>
                            <label for="masking-fields" class="block text-sm font-medium mb-2">脱敏字段</label>
                            <select id="masking-fields" class="w-full px-4 py-2 rounded-md bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500" multiple>
                                <option value="name">姓名</option>
                                <option value="id">身份证号</option>
                                <option value="phone">手机号码</option>
                                <option value="email">电子邮箱</option>
                                <option value="address">地址</option>
                                <option value="bank">银行卡号</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-8 grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div>
                            <label for="masking-input" class="block text-sm font-medium mb-2">原始数据 (JSON格式)</label>
                            <textarea id="masking-input" rows="10" class="w-full px-4 py-2 rounded-md bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500" placeholder='例如: {"name":"张三","phone":"13800138000","email":"zhangsan@example.com"}'></textarea>
                        </div>
                        <div>
                            <label for="masking-output" class="block text-sm font-medium mb-2">脱敏结果</label>
                            <textarea id="masking-output" rows="10" class="w-full px-4 py-2 rounded-md bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500" readonly></textarea>
                        </div>
                    </div>

                    <div class="mt-6 flex justify-end">
                        <button id="masking-btn" class="px-6 py-2 bg-purple-600 rounded-md hover:bg-purple-700 transition flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M3 5a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2h-2.22l.06.06a2 2 0 001.68.59H18a1 1 0 001-1v-2.59a2 2 0 00-.59-1.41L15.17 10H15a1 1 0 01-1-1V8a1 1 0 011-1h2.59a2 2 0 001.41-.59l.41-.41V5a4 4 0 00-4-4H5a4 4 0 00-4 4v10a4 4 0 004 4h3v-1H5a2 2 0 01-2-2V5zm7 1a1 1 0 011-1h2a1 1 0 110 2h-2a1 1 0 01-1-1zm0 4a1 1 0 011-1h2a1 1 0 110 2h-2a1 1 0 01-1-1z" clip-rule="evenodd" />
                            </svg>
                            执行脱敏
                        </button>
                    </div>
                </div>
            </div>

            <!-- 密钥管理区域 (默认隐藏) -->
            <div id="keys-section" class="hidden">
                <div class="bg-gray-800 bg-opacity-70 rounded-xl shadow-lg overflow-hidden mb-8">
                    <div class="px-6 py-4 border-b border-gray-700 flex justify-between items-center">
                        <h2 class="text-xl font-bold">密钥管理</h2>
                        <button id="add-key-btn" class="px-4 py-2 bg-green-600 rounded-md hover:bg-green-700 transition flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                            </svg>
                            新建密钥
                        </button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-700">
                            <thead class="bg-gray-900 bg-opacity-50">
                                <tr>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">密钥名称</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">算法</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">创建时间</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">过期时间</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">状态</th>
                                    <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-400 uppercase tracking-wider">操作</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-700" id="keys-table-body">
                                <tr class="hover:bg-gray-700 transition">
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="flex items-center">
                                            <div class="text-sm font-medium text-white">主加密密钥</div>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="text-sm text-gray-300">AES-256</div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">2025-01-15</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">2026-01-15</td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-500">活跃</span>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                        <button class="text-blue-400 hover:text-blue-300 mr-3">详情</button>
                                        <button class="text-red-400 hover:text-red-300">撤销</button>
                                    </td>
                                </tr>
                                <tr class="hover:bg-gray-700 transition">
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="flex items-center">
                                            <div class="text-sm font-medium text-white">备份密钥</div>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="text-sm text-gray-300">AES-256</div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">2025-03-20</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">2026-03-20</td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-500">活跃</span>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                        <button class="text-blue-400 hover:text-blue-300 mr-3">详情</button>
                                        <button class="text-red-400 hover:text-red-300">撤销</button>
                                    </td>
                                </tr>
                                <tr class="hover:bg-gray-700 transition">
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="flex items-center">
                                            <div class="text-sm font-medium text-white">临时密钥</div>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="text-sm text-gray-300">AES-128</div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">2025-05-10</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">2025-06-10</td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-500">即将过期</span>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                        <button class="text-blue-400 hover:text-blue-300 mr-3">详情</button>
                                        <button class="text-red-400 hover:text-red-300">撤销</button>
                                    </td>
                                </tr>
                                <tr class="hover:bg-gray-700 transition">
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="flex items-center">
                                            <div class="text-sm font-medium text-white">旧版密钥</div>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="text-sm text-gray-300">RSA-OAEP</div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">2024-11-01</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">2025-05-01</td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-500">已过期</span>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                        <button class="text-blue-400 hover:text-blue-300 mr-3">详情</button>
                                        <button class="text-gray-400 hover:text-gray-300" disabled>撤销</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 新增密钥模态框 -->
                <div id="add-key-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
                    <div class="bg-gray-800 rounded-xl shadow-2xl w-full max-w-2xl">
                        <div class="px-6 py-4 border-b border-gray-700 flex justify-between items-center">
                            <h3 class="text-lg font-semibold">创建新密钥</h3>
                            <button id="close-key-modal-btn" class="text-gray-400 hover:text-gray-200">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>
                        <div class="p-6">
                            <form id="key-form">
                                <div class="grid grid-cols-1 gap-6">
                                    <div>
                                        <label for="key-name" class="block text-sm font-medium mb-2">密钥名称</label>
                                        <input type="text" id="key-name" class="w-full px-4 py-2 rounded-md bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500" required>
                                    </div>
                                    <div>
                                        <label for="key-algorithm" class="block text-sm font-medium mb-2">加密算法</label>
                                        <select id="key-algorithm" class="w-full px-4 py-2 rounded-md bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500" required>
                                            <option value="">选择算法</option>
                                            <option value="aes-256">AES-256 (推荐)</option>
                                            <option value="aes-192">AES-192</option>
                                            <option value="aes-128">AES-128</option>
                                            <option value="rsa-oaep">RSA-OAEP</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label for="key-expiry" class="block text-sm font-medium mb-2">过期时间</label>
                                        <select id="key-expiry" class="w-full px-4 py-2 rounded-md bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500" required>
                                            <option value="1m">1个月</option>
                                            <option value="3m">3个月</option>
                                            <option value="6m" selected>6个月</option>
                                            <option value="1y">1年</option>
                                            <option value="2y">2年</option>
                                            <option value="never">永不过期</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label for="key-description" class="block text-sm font-medium mb-2">密钥描述</label>
                                        <textarea id="key-description" rows="3" class="w-full px-4 py-2 rounded-md bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500"></textarea>
                                    </div>
                                </div>
                            </form>
                        </div>
                        <div class="px-6 py-4 border-t border-gray-700 flex justify-end space-x-3">
                            <button id="cancel-key-btn" class="px-4 py-2 bg-gray-700 rounded-md hover:bg-gray-600 transition">取消</button>
                            <button id="generate-key-btn" class="px-4 py-2 bg-blue-600 rounded-md hover:bg-blue-700 transition">生成密钥</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 粒子效果初始化
            particlesJS('particles-js', {
                particles: {
                    number: { value: 70, density: { enable: true, value_area: 800 } },
                    color: { value: "#3b82f6" },
                    shape: { type: "circle" },
                    opacity: { value: 0.5, random: true },
                    size: { value: 3, random: true },
                    line_linked: { enable: true, distance: 150, color: "#3b82f6", opacity: 0.4, width: 1 },
                    move: { enable: true, speed: 2, direction: "none", random: true, straight: false, out_mode: "out" }
                },
                interactivity: {
                    detect_on: "canvas",
                    events: {
                        onhover: { enable: true, mode: "repulse" },
                        onclick: { enable: true, mode: "push" }
                    }
                }
            });

            // 选项卡切换
            const tabs = {
                'encrypt-tab': 'encrypt-section',
                'decrypt-tab': 'decrypt-section',
                'masking-tab': 'masking-section',
                'keys-tab': 'keys-section'
            };

            Object.entries(tabs).forEach(([tabId, sectionId]) => {
                const tab = document.getElementById(tabId);
                const section = document.getElementById(sectionId);

                tab.addEventListener('click', function() {
                    // 更新选项卡状态
                    document.querySelectorAll('.tab-button').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');

                    // 隐藏所有内容区
                    Object.values(tabs).forEach(id => {
                        document.getElementById(id).classList.add('hidden');
                    });

                    // 显示当前内容区
                    section.classList.remove('hidden');
                });
            });

            // 加密按钮事件
            document.getElementById('encrypt-btn').addEventListener('click', function() {
                const input = document.getElementById('encrypt-input').value.trim();
                const key = document.getElementById('encrypt-key').value;
                
                if (!input) {
                    alert('请输入需要加密的内容');
                    return;
                }
                
                if (!key) {
                    alert('请选择加密密钥');
                    return;
                }

                // 模拟加密过程
                document.getElementById('encrypt-output').value = '正在开发中：加密功能\n\n模拟加密结果:\n' + 
                    btoa(encodeURIComponent(input)).match(/.{1,64}/g).join('\n');
            });

            // 解密按钮事件
            document.getElementById('decrypt-btn').addEventListener('click', function() {
                const input = document.getElementById('decrypt-input').value.trim();
                const key = document.getElementById('decrypt-key').value;
                
                if (!input) {
                    alert('请输入需要解密的内容');
                    return;
                }
                
                if (!key) {
                    alert('请选择解密密钥');
                    return;
                }

                try {
                    // 模拟解密过程
                    const decoded = decodeURIComponent(atob(input.replace(/\s/g, '')));
                    document.getElementById('decrypt-output').value = '正在开发中：解密功能\n\n模拟解密结果:\n' + decoded;
                } catch (e) {
                    document.getElementById('decrypt-output').value = '解密失败: 输入的数据格式不正确';
                }
            });

            // 脱敏按钮事件
            document.getElementById('masking-btn').addEventListener('click', function() {
                const input = document.getElementById('masking-input').value.trim();
                
                if (!input) {
                    alert('请输入需要脱敏的数据');
                    return;
                }

                try {
                    // 模拟脱敏过程
                    const data = JSON.parse(input);
                    const maskedData = {};
                    
                    for (const key in data) {
                        if (document.getElementById('masking-fields').selectedOptions.length === 0 || 
                            Array.from(document.getElementById('masking-fields').selectedOptions).some(opt => opt.value === key)) {
                            
                            const value = data[key];
                            const pattern = document.getElementById('masking-pattern').value;
                            
                            if (pattern === 'full') {
                                maskedData[key] = '*'.repeat(value.length);
                            } else if (pattern === 'partial') {
                                if (value.length <= 2) {
                                    maskedData[key] = '*'.repeat(value.length);
                                } else {
                                    maskedData[key] = value.charAt(0) + '*'.repeat(value.length - 2) + value.charAt(value.length - 1);
                                }
                            } else if (pattern === 'hash') {
                                maskedData[key] = 'hash_' + Math.abs(value.split('').reduce((a, b) => {
                                    a = ((a << 5) - a) + b.charCodeAt(0);
                                    return a & a;
                                }, 0)).toString(16).substring(0, 8);
                            } else {
                                maskedData[key] = value.split('').map(c => Math.random() > 0.5 ? c : '*').join('');
                            }
                        } else {
                            maskedData[key] = data[key];
                        }
                    }
                    
                    document.getElementById('masking-output').value = JSON.stringify(maskedData, null, 2);
                } catch (e) {
                    document.getElementById('masking-output').value = '脱敏失败: 输入的数据不是有效的JSON格式';
                }
            });

            // 密钥管理模态框控制
            const keyModal = document.getElementById('add-key-modal');
            const addKeyBtn = document.getElementById('add-key-btn');
            const closeKeyModalBtn = document.getElementById('close-key-modal-btn');
            const cancelKeyBtn = document.getElementById('cancel-key-btn');

            addKeyBtn.addEventListener('click', function() {
                keyModal.classList.remove('hidden');
                document.getElementById('key-form').reset();
            });

            closeKeyModalBtn.addEventListener('click', function() {
                keyModal.classList.add('hidden');
            });

            cancelKeyBtn.addEventListener('click', function() {
                keyModal.classList.add('hidden');
            });

            // 生成密钥按钮事件
            document.getElementById('generate-key-btn').addEventListener('click', function() {
                const form = document.getElementById('key-form');
                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }

                const name = document.getElementById('key-name').value;
                const algorithm = document.getElementById('key-algorithm').value;
                
                alert(`正在开发中：密钥生成功能\n\n模拟生成密钥:\n名称: ${name}\n算法: ${algorithm}`);
                
                keyModal.classList.add('hidden');
            });

            // 复制按钮事件
            document.getElementById('copy-encrypt').addEventListener('click', function() {
                const output = document.getElementById('encrypt-output');
                output.select();
                document.execCommand('copy');
                alert('已复制到剪贴板');
            });

            document.getElementById('copy-decrypt').addEventListener('click', function() {
                const output = document.getElementById('decrypt-output');
                output.select();
                document.execCommand('copy');
                alert('已复制到剪贴板');
            });

            // 保存到文件按钮事件
            document.getElementById('save-encrypt').addEventListener('click', function() {
                const output = document.getElementById('encrypt-output').value;
                if (!output) {
                    alert('没有可保存的内容');
                    return;
                }

                alert('正在开发中：保存到文件功能');
            });
        });
    </script>
</body>
</html>
