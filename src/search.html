
<!-- video_monitoring_replay_service/frontend/search.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>监控视频数字化回放服务软件- 录像查询</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.loli.net/css?family=Noto+Sans+SC:400,500,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
        }
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        .main-container {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-field {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }
        .table-row:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .play-btn {
            transition: all 0.2s ease;
        }
        .play-btn:hover {
            transform: scale(1.1);
            background: rgba(59, 130, 246, 0.5);
        }
        .pagination-btn {
            transition: all 0.2s ease;
        }
        .pagination-btn:hover:not(.disabled) {
            background: rgba(255, 255, 255, 0.1);
        }
        .disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="text-white">
    <div class="particles" id="particles-js"></div>
    
    <div class="container mx-auto px-4 py-6 relative z-10">
        <!-- 顶部导航 -->
        <div class="main-container rounded-xl p-4 mb-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center">
                <span class="mr-2">🔍</span> 录像查询
            </h1>
            <div class="flex space-x-4">
                <a href="home.html" class="px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 transition">
                    <span class="mr-2">🏠</span> 返回主页
                </a>
                <button id="logoutBtn" class="px-4 py-2 rounded-lg bg-red-500 hover:bg-red-600 transition">
                    退出登录
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 gap-6">
            <!-- 查询条件 -->
            <div class="main-container rounded-xl p-6">
                <h2 class="text-xl font-medium mb-4">查询条件</h2>
                <form id="searchForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    <div>
                        <label for="vehicle" class="block text-sm font-medium text-gray-300 mb-1">车辆编号</label>
                        <select id="vehicle" class="input-field w-full px-4 py-2 rounded-lg focus:outline-none">
                            <option value="">全部车辆</option>
                            <option value="V001">V001 - 车辆前摄像头</option>
                            <option value="V002">V002 - 车门监控</option>
                            <option value="V003">V003 - 车内监控</option>
                        </select>
                    </div>
                    
                    <div>
                        <label for="channel" class="block text-sm font-medium text-gray-300 mb-1">通道</label>
                        <select id="channel" class="input-field w-full px-4 py-2 rounded-lg focus:outline-none">
                            <option value="">全部通道</option>
                            <option value="CH1">通道1</option>
                            <option value="CH2">通道2</option>
                            <option value="CH3">通道3</option>
                        </select>
                    </div>
                    
                    <div>
                        <label for="startTime" class="block text-sm font-medium text-gray-300 mb-1">开始时间</label>
                        <input type="datetime-local" id="startTime" class="input-field w-full px-4 py-2 rounded-lg focus:outline-none">
                    </div>
                    
                    <div>
                        <label for="endTime" class="block text-sm font-medium text-gray-300 mb-1">结束时间</label>
                        <input type="datetime-local" id="endTime" class="input-field w-full px-4 py-2 rounded-lg focus:outline-none">
                    </div>
                    
                    <div class="md:col-span-2">
                        <label for="alarmType" class="block text-sm font-medium text-gray-300 mb-1">报警类型</label>
                        <select id="alarmType" class="input-field w-full px-4 py-2 rounded-lg focus:outline-none">
                            <option value="">全部类型</option>
                            <option value="motion">移动侦测</option>
                            <option value="abnormal">异常行为</option>
                            <option value="impact">碰撞检测</option>
                            <option value="face">人脸识别</option>
                        </select>
                    </div>
                    
                    <div class="md:col-span-2 flex items-end">
                        <button type="submit" class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg">
                            <span class="mr-2">🔍</span> 查询录像
                        </button>
                    </div>
                </form>
            </div>

            <!-- 查询结果 -->
            <div class="main-container rounded-xl p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-medium">查询结果</h2>
                    <div class="text-sm text-gray-400">
                        共 <span id="totalCount" class="text-white">12</span> 条记录
                    </div>
                </div>
                
                <div class="overflow-x-auto mb-4">
                    <table class="w-full">
                        <thead>
                            <tr class="border-b border-gray-700">
                                <th class="px-4 py-3 text-left">序号</th>
                                <th class="px-4 py-3 text-left">车辆编号</th>
                                <th class="px-4 py-3 text-left">通道</th>
                                <th class="px-4 py-3 text-left">开始时间</th>
                                <th class="px-4 py-3 text-left">结束时间</th>
                                <th class="px-4 py-3 text-left">时长</th>
                                <th class="px-4 py-3 text-left">报警类型</th>
                                <th class="px-4 py-3 text-left">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="table-row border-b border-gray-700">
                                <td class="px-4 py-3">1</td>
                                <td class="px-4 py-3">V001 - 车辆前摄像头</td>
                                <td class="px-4 py-3">通道1</td>
                                <td class="px-4 py-3">2025-05-27 09:30:15</td>
                                <td class="px-4 py-3">2025-05-27 09:35:42</td>
                                <td class="px-4 py-3">5分27秒</td>
                                <td class="px-4 py-3">
                                    <span class="px-2 py-1 bg-red-500/20 text-red-400 rounded-full text-xs">移动侦测</span>
                                </td>
                                <td class="px-4 py-3">
                                    <button class="play-btn px-3 py-1 rounded bg-blue-600 mr-2" onclick="playVideo(1)">
                                        ▶️ 播放
                                    </button>
                                    <button class="play-btn px-3 py-1 rounded bg-green-600" onclick="downloadVideo(1)">
                                        ⬇️ 下载
                                    </button>
                                </td>
                            </tr>
                            <tr class="table-row border-b border-gray-700">
                                <td class="px-4 py-3">2</td>
                                <td class="px-4 py-3">V002 - 车门监控</td>
                                <td class="px-4 py-3">通道2</td>
                                <td class="px-4 py-3">2025-05-27 14:12:33</td>
                                <td class="px-4 py-3">2025-05-27 14:15:08</td>
                                <td class="px-4 py-3">2分35秒</td>
                                <td class="px-4 py-3">
                                    <span class="px-2 py-1 bg-yellow-500/20 text-yellow-400 rounded-full text-xs">异常行为</span>
                                </td>
                                <td class="px-4 py-3">
                                    <button class="play-btn px-3 py-1 rounded bg-blue-600 mr-2" onclick="playVideo(2)">
                                        ▶️ 播放
                                    </button>
                                    <button class="play-btn px-3 py-1 rounded bg-green-600" onclick="downloadVideo(2)">
                                        ⬇️ 下载
                                    </button>
                                </td>
                            </tr>
                            <tr class="table-row border-b border-gray-700">
                                <td class="px-4 py-3">3</td>
                                <td class="px-4 py-3">V003 - 车内监控</td>
                                <td class="px-4 py-3">通道3</td>
                                <td class="px-4 py-3">2025-05-28 08:45:21</td>
                                <td class="px-4 py-3">2025-05-28 08:50:03</td>
                                <td class="px-4 py-3">4分42秒</td>
                                <td class="px-4 py-3">
                                    <span class="px-2 py-1 bg-purple-500/20 text-purple-400 rounded-full text-xs">人脸识别</span>
                                </td>
                                <td class="px-4 py-3">
                                    <button class="play-btn px-3 py-1 rounded bg-blue-600 mr-2" onclick="playVideo(3)">
                                        ▶️ 播放
                                    </button>
                                    <button class="play-btn px-3 py-1 rounded bg-green-600" onclick="downloadVideo(3)">
                                        ⬇️ 下载
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 分页控件 -->
                <div class="flex justify-between items-center mt-6">
                    <div class="text-sm text-gray-400">
                        显示 <span class="text-white">1-3</span> 条，共 <span class="text-white">12</span> 条
                    </div>
                    <div class="flex space-x-2">
                        <button class="pagination-btn px-3 py-1 rounded bg-gray-700 disabled">
                            ⏮️ 首页
                        </button>
                        <button class="pagination-btn px-3 py-1 rounded bg-gray-700 disabled">
                            ◀️ 上一页
                        </button>
                        <button class="pagination-btn px-3 py-1 rounded bg-blue-600">
                            1
                        </button>
                        <button class="pagination-btn px-3 py-1 rounded bg-gray-700">
                            2
                        </button>
                        <button class="pagination-btn px-3 py-1 rounded bg-gray-700">
                            3
                        </button>
                        <button class="pagination-btn px-3 py-1 rounded bg-gray-700">
                            4
                        </button>
                        <button class="pagination-btn px-3 py-1 rounded bg-gray-700">
                            ▶️ 下一页
                        </button>
                        <button class="pagination-btn px-3 py-1 rounded bg-gray-700">
                            ⏭️ 末页
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 粒子效果初始化
            particlesJS('particles-js', {
                particles: {
                    number: { value: 50, density: { enable: true, value_area: 800 } },
                    color: { value: "#ffffff" },
                    shape: { type: "circle" },
                    opacity: { value: 0.3, random: true },
                    size: { value: 3, random: true },
                    line_linked: { enable: true, distance: 150, color: "#ffffff", opacity: 0.2, width: 1 },
                    move: { enable: true, speed: 1.5, direction: "none", random: true, straight: false, out_mode: "out" }
                }
            });

            // 检查登录状态
            if(localStorage.getItem('isLoggedIn') !== 'true') {
                window.location.href = 'index.html';
            }

            // 退出登录
            document.getElementById('logoutBtn').addEventListener('click', function() {
                localStorage.removeItem('isLoggedIn');
                window.location.href = 'index.html';
            });

            // 表单提交
            document.getElementById('searchForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const vehicle = document.getElementById('vehicle').value;
                const channel = document.getElementById('channel').value;
                const startTime = document.getElementById('startTime').value;
                const endTime = document.getElementById('endTime').value;
                const alarmType = document.getElementById('alarmType').value;
                
                // 验证时间范围
                if(startTime && endTime && new Date(startTime) > new Date(endTime)) {
                    alert('开始时间不能晚于结束时间');
                    return;
                }
                
                // 模拟查询
                alert('正在查询：\n车辆: ' + (vehicle || '全部') + 
                      '\n通道: ' + (channel || '全部') + 
                      '\n时间: ' + (startTime ? new Date(startTime).toLocaleString() : '全部') + ' 至 ' + 
                      (endTime ? new Date(endTime).toLocaleString() : '全部') + 
                      '\n报警类型: ' + (alarmType || '全部'));
            });

            // 设置默认时间
            const now = new Date();
            document.getElementById('endTime').value = now.toISOString().slice(0, 16);
            
            const yesterday = new Date(now);
            yesterday.setDate(now.getDate() - 1);
            document.getElementById('startTime').value = yesterday.toISOString().slice(0, 16);
        });

        // 播放视频
        function playVideo(id) {
            localStorage.setItem('selectedVideo', id);
            window.location.href = 'home.html';
        }

        // 下载视频
        function downloadVideo(id) {
            alert(`正在准备下载视频ID ${id}...`);
            // 模拟下载进度
            let progress = 0;
            const interval = setInterval(() => {
                progress += 10;
                console.log(`下载进度: ${progress}%`);
                if(progress >= 100) {
                    clearInterval(interval);
                    alert(`视频ID ${id} 下载完成！`);
                }
            }, 300);
        }
    </script>
</body>
</html>
