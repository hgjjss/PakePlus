
<!-- video_monitoring_replay_service/frontend/index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>监控视频数字化回放服务软件- 登录</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.loli.net/css?family=Noto+Sans+SC:400,500,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            height: 100vh;
            overflow: hidden;
        }
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        .login-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-field {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            transition: all 0.3s ease;
        }
        .input-field:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }
        .btn-login {
            background: linear-gradient(45deg, #2563eb, #3b82f6);
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }
        .error-message {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }
        .security-tip {
            background: rgba(239, 68, 68, 0.1);
            border-left: 3px solid #ef4444;
            padding: 0.75rem;
            border-radius: 0 4px 4px 0;
            margin-top: 1rem;
        }
    </style>
</head>
<body class="flex items-center justify-center">
    <div class="particles" id="particles-js"></div>
    <div class="login-card p-10 w-full max-w-md relative z-10">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-white mb-2">监控视频数字化回放服务软件</h1>
            <p class="text-gray-300">全方位实时监控 · 智能分析 · 精准回放</p>
        </div>
        
        <form id="loginForm" class="space-y-6">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-300 mb-1">用户名</label>
                <input type="text" id="username" name="username" 
                       class="input-field w-full px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" 
                       placeholder="请输入用户名" required>
                <div id="usernameError" class="error-message">请输入有效的用户名</div>
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium text-gray-300 mb-1">密码</label>
                <input type="password" id="password" name="password" 
                       class="input-field w-full px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" 
                       placeholder="请输入密码" required minlength="5">
                <div id="passwordError" class="error-message">密码长度至少5位</div>
            </div>
            
            <div class="security-tip">
                <p class="text-sm text-red-400">⚠️ 安全提示：请勿在公共设备上保存登录信息</p>
            </div>
            
            <div>
                <button type="submit" 
                        class="btn-login w-full py-3 px-4 text-white font-medium rounded-lg shadow-md">
                    登录系统
                </button>
            </div>
        </form>
        
        <div class="mt-6 text-center text-gray-400 text-sm">
            <p>默认账号: admin / 12345</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // 粒子效果初始化
        document.addEventListener('DOMContentLoaded', function() {
            particlesJS('particles-js', {
                particles: {
                    number: { value: 80, density: { enable: true, value_area: 800 } },
                    color: { value: "#ffffff" },
                    shape: { type: "circle" },
                    opacity: { value: 0.5, random: true },
                    size: { value: 3, random: true },
                    line_linked: { enable: true, distance: 150, color: "#ffffff", opacity: 0.4, width: 1 },
                    move: { enable: true, speed: 2, direction: "none", random: true, straight: false, out_mode: "out" }
                },
                interactivity: {
                    detect_on: "canvas",
                    events: {
                        onhover: { enable: true, mode: "repulse" },
                        onclick: { enable: true, mode: "push" }
                    }
                }
            });

            // 登录表单验证
            const loginForm = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const usernameError = document.getElementById('usernameError');
            const passwordError = document.getElementById('passwordError');

            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // 重置错误状态
                usernameError.style.display = 'none';
                passwordError.style.display = 'none';
                
                let isValid = true;
                
                // 用户名验证
                if(usernameInput.value.trim() === '') {
                    usernameError.style.display = 'block';
                    isValid = false;
                }
                
                // 密码验证
                if(passwordInput.value.length < 5) {
                    passwordError.style.display = 'block';
                    isValid = false;
                }
                
                if(!isValid) return;
                
                const username = usernameInput.value;
                const password = passwordInput.value;
                
                if(username === 'admin' && password === '12345') {
                    localStorage.setItem('isLoggedIn', 'true');
                    window.location.href = 'home.html';
                } else {
                    alert('用户名或密码错误，请重试！');
                }
            });

            // 输入时实时验证
            usernameInput.addEventListener('input', function() {
                if(this.value.trim() !== '') {
                    usernameError.style.display = 'none';
                }
            });

            passwordInput.addEventListener('input', function() {
                if(this.value.length >= 5) {
                    passwordError.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
