
<!-- management_monitoring_system/frontend/index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>管理与监控信息共享系统 | 登录</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            overflow: hidden;
        }
        
        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.3s ease;
        }
        
        .glass:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px 0 rgba(31, 38, 135, 0.5);
        }
        
        .input-field {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            border-radius: 5px;
            padding: 10px 15px;
            color: white;
            transition: all 0.3s ease;
        }
        
        .input-field:focus {
            background: rgba(255, 255, 255, 0.25);
            outline: none;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        .login-btn {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            color: white;
            transition: all 0.3s ease;
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.5;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
        
        .system-title {
            font-weight: bold;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .error-message {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.2);
            border-left: 4px solid #ff6b6b;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        
        .success-icon {
            display: inline-block;
            transform: scale(0);
            transition: transform 0.3s ease;
        }
        
        .success .success-icon {
            transform: scale(1);
        }
    </style>
</head>
<body class="flex items-center justify-center">
    <!-- 粒子背景 -->
    <div class="particles" id="particles"></div>
    
    <div class="container mx-auto px-4">
        <div class="flex flex-col items-center justify-center">
            <!-- 登录卡片 -->
            <div class="glass w-full max-w-md p-8 mb-8">
                <div class="text-center mb-10">
                    <h1 class="system-title text-white text-3xl md:text-4xl font-bold mb-2">
                        <i class="fas fa-chart-line mr-2"></i>管理与监控信息共享系统
                    </h1>
                    <p class="text-white opacity-80">实时数据 · 智能分析 · 可视化监管平台</p>
                </div>
                
                <div class="error-message" id="error-message">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    <span id="error-text">用户名或密码错误，请重试</span>
                </div>
                
                <form id="login-form" class="space-y-6">
                    <div>
                        <label for="username" class="block text-white mb-2">用户名</label>
                        <div class="relative">
                            <span class="absolute left-3 top-3 text-white opacity-70">
                                <i class="fas fa-user"></i>
                            </span>
                            <input type="text" id="username" name="username" class="input-field w-full pl-10" placeholder="请输入用户名" required>
                            <span class="success-icon absolute right-3 top-3 text-green-400 opacity-0 transition-opacity">
                                <i class="fas fa-check-circle"></i>
                            </span>
                        </div>
                    </div>
                    
                    <div>
                        <label for="password" class="block text-white mb-2">密码</label>
                        <div class="relative">
                            <span class="absolute left-3 top-3 text-white opacity-70">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" id="password" name="password" class="input-field w-full pl-10" placeholder="请输入密码" required>
                            <span class="success-icon absolute right-3 top-3 text-green-400 opacity-0 transition-opacity">
                                <i class="fas fa-check-circle"></i>
                            </span>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input type="checkbox" id="remember-me" name="remember-me" class="mr-2">
                            <label for="remember-me" class="text-white">记住我</label>
                        </div>
                        <a href="#" class="text-white hover:underline text-sm">忘记密码?</a>
                    </div>
                    
                    <button type="submit" class="login-btn w-full py-3 font-bold">
                        <i class="fas fa-sign-in-alt mr-2"></i>登录
                    </button>
                </form>
            </div>
            
            <p class="text-white text-opacity-70 text-sm">
                © 2025 管理与监控信息共享系统 | 技术支持
            </p>
        </div>
    </div>
    
    <script>
        // 创建粒子效果
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particlesCount = 50;
            
            for (let i = 0; i < particlesCount; i++) {
                const size = Math.random() * 5 + 1;
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;
                particle.style.background = `rgba(255, 255, 255, ${Math.random() * 0.5 + 0.2})`;
                particle.style.animation = `float ${Math.random() * 8 + 4}s ease-in-out infinite`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                
                particlesContainer.appendChild(particle);
            }
        }
        
        // 登录验证
        document.addEventListener('DOMContentLoaded', function() {
            createParticles();
            
            // 检查是否已登录
            if (localStorage.getItem('isLoggedIn') === 'true') {
                window.location.href = 'dashboard.html';
            }
            
            const form = document.getElementById('login-form');
            const errorMessage = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();
                const rememberMe = document.getElementById('remember-me').checked;
                
                // 简单的表单验证
                if (!username || !password) {
                    errorText.textContent = '用户名和密码不能为空';
                    errorMessage.style.display = 'block';
                    return;
                }
                
                // 登录验证 (用户名: admin, 密码: 12345)
                if (username === 'admin' && password === '12345') {
                    // 登录成功，存储登录状态
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('username', username);
                    
                    if (rememberMe) {
                        localStorage.setItem('rememberMe', 'true');
                    } else {
                        localStorage.removeItem('rememberMe');
                    }
                    
                    // 显示登录成功动画
                    const btn = form.querySelector('button[type="submit"]');
                    btn.innerHTML = '<i class="fas fa-check mr-2"></i>登录成功';
                    btn.classList.add('bg-green-500');
                    
                    // 跳转到主页面
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    // 登录失败
                    errorText.textContent = '用户名或密码错误，请重试';
                    errorMessage.style.display = 'block';
                    
                    // 震动效果
                    form.classList.add('shake');
                    setTimeout(() => {
                        form.classList.remove('shake');
                    }, 500);
                }
            });
            
            // 输入框焦点效果
            const inputs = document.querySelectorAll('.input-field');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentNode.classList.add('focused');
                });
                
                input.addEventListener('blur', function() {
                    this.parentNode.classList.remove('focused');
                    
                    // 如果有输入则显示成功图标
                    if (this.value.trim() !== '') {
                        this.parentNode.querySelector('.success-icon').style.opacity = '1';
                    } else {
                        this.parentNode.querySelector('.success-icon').style.opacity = '0';
                    }
                });
            });
            
            // 关闭错误消息
            errorMessage.addEventListener('click', function() {
                this.style.display = 'none';
            });
        });
    </script>
</body>
</html>
