
<!-- integrated_security_data_management_system_7053/frontend/monitoring.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>系统监控 - 一体化安全数据管理系统</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.loli.net/css?family=Noto+Sans+SC:400,500,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
        }
        .card-hover:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
        }
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
    </style>
</head>
<body class="text-gray-100">
    <div id="particles-js"></div>
    
    <div class="container mx-auto px-4 py-8">
        <!-- 顶部导航栏 -->
        <header class="flex justify-between items-center mb-8">
            <div class="flex items-center">
                <button onclick="window.history.back()" class="mr-4 p-2 rounded-full hover:bg-gray-700 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </button>
                <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-600">
                    系统监控仪表盘
                </h1>
            </div>
            <div class="flex items-center space-x-4">
                <div class="relative">
                    <input type="text" id="search-input" placeholder="搜索监控项..." class="px-4 py-2 bg-gray-700 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 w-64">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 absolute right-3 top-2.5 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                    </svg>
                </div>
                <button id="refresh-btn" class="p-2 rounded-md bg-gray-700 hover:bg-gray-600 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- 主内容区 -->
        <main>
            <!-- 系统状态概览 -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <div class="bg-gray-800 bg-opacity-70 rounded-xl p-6 shadow-lg card-hover">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-sm text-gray-400">CPU使用率</p>
                            <h2 class="text-2xl font-bold mt-1" id="cpu-usage">23.5%</h2>
                        </div>
                        <div class="bg-blue-500 bg-opacity-20 p-3 rounded-full">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z" />
                            </svg>
                        </div>
                    </div>
                    <div class="mt-4">
                        <div class="w-full bg-gray-700 rounded-full h-2">
                            <div class="bg-blue-500 h-2 rounded-full" style="width: 23.5%"></div>
                        </div>
                    </div>
                </div>

                <div class="bg-gray-800 bg-opacity-70 rounded-xl p-6 shadow-lg card-hover">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-sm text-gray-400">内存使用</p>
                            <h2 class="text-2xl font-bold mt-1" id="memory-usage">4.2/16 GB</h2>
                        </div>
                        <div class="bg-green-500 bg-opacity-20 p-3 rounded-full">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v14a1 1 0 01-1 1H5a1 1 0 01-1-1V5z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 9h6v6H9V9z" />
                            </svg>
                        </div>
                    </div>
                    <div class="mt-4">
                        <div class="w-full bg-gray-700 rounded-full h-2">
                            <div class="bg-green-500 h-2 rounded-full" style="width: 26.25%"></div>
                        </div>
                    </div>
                </div>

                <div class="bg-gray-800 bg-opacity-70 rounded-xl p-6 shadow-lg card-hover">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-sm text-gray-400">存储空间</p>
                            <h2 class="text-2xl font-bold mt-1" id="storage-usage">128/500 GB</h2>
                        </div>
                        <div class="bg-purple-500 bg-opacity-20 p-3 rounded-full">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v14a1 1 0 01-1 1H5a1 1 0 01-1-1V5z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7h2m0 4h2m0 4h2M7 7h2m0 4h2m0 4h2" />
                            </svg>
                        </div>
                    </div>
                    <div class="mt-4">
                        <div class="w-full bg-gray-700 rounded-full h-2">
                            <div class="bg-purple-500 h-2 rounded-full" style="width: 25.6%"></div>
                        </div>
                    </div>
                </div>

                <div class="bg-gray-800 bg-opacity-70 rounded-xl p-6 shadow-lg card-hover">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-sm text-gray-400">网络流量</p>
                            <h2 class="text-2xl font-bold mt-1" id="network-usage">12.3 Mbps</h2>
                        </div>
                        <div class="bg-yellow-500 bg-opacity-20 p-3 rounded-full">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                            </svg>
                        </div>
                    </div>
                    <div class="mt-4">
                        <div class="w-full bg-gray-700 rounded-full h-2">
                            <div class="bg-yellow-500 h-2 rounded-full" style="width: 30%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 图表区域 -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
                <!-- CPU使用率图表 -->
                <div class="bg-gray-800 bg-opacity-70 rounded-xl p-6 shadow-lg">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold">CPU使用率历史</h2>
                        <div class="flex space-x-2">
                            <button class="time-range-btn px-3 py-1 rounded-md bg-blue-600 text-white" data-range="1h">1小时</button>
                            <button class="time-range-btn px-3 py-1 rounded-md bg-gray-700 hover:bg-gray-600" data-range="6h">6小时</button>
                            <button class="time-range-btn px-3 py-1 rounded-md bg-gray-700 hover:bg-gray-600" data-range="24h">24小时</button>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="cpu-chart"></canvas>
                    </div>
                </div>

                <!-- 内存使用图表 -->
                <div class="bg-gray-800 bg-opacity-70 rounded-xl p-6 shadow-lg">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold">内存使用历史</h2>
                        <div class="flex space-x-2">
                            <button class="time-range-btn px-3 py-1 rounded-md bg-blue-600 text-white" data-range="1h">1小时</button>
                            <button class="time-range-btn px-3 py-1 rounded-md bg-gray-700 hover:bg-gray-600" data-range="6h">6小时</button>
                            <button class="time-range-btn px-3 py-1 rounded-md bg-gray-700 hover:bg-gray-600" data-range="24h">24小时</button>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="memory-chart"></canvas>
                    </div>
                </div>
            </div>

            <!-- 服务状态 -->
            <div class="bg-gray-800 bg-opacity-70 rounded-xl shadow-lg overflow-hidden mb-8">
                <div class="px-6 py-4 border-b border-gray-700">
                    <h2 class="text-lg font-bold">服务状态监控</h2>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-700">
                        <thead class="bg-gray-900 bg-opacity-50">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">服务名称</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">状态</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">运行时间</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">CPU占用</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">内存占用</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">最后检查</th>
                                <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-400 uppercase tracking-wider">操作</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-700" id="services-table-body">
                            <!-- 服务状态行将通过JavaScript动态生成 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 告警信息 -->
            <div class="bg-gray-800 bg-opacity-70 rounded-xl shadow-lg overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-700 flex justify-between items-center">
                    <h2 class="text-lg font-bold">最近告警</h2>
                    <button id="view-all-alerts" class="text-sm text-blue-400 hover:text-blue-300">查看全部</button>
                </div>
                <div class="divide-y divide-gray-700" id="alerts-list">
                    <!-- 告警信息将通过JavaScript动态生成 -->
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 粒子效果初始化
            particlesJS('particles-js', {
                particles: {
                    number: { value: 70, density: { enable: true, value_area: 800 } },
                    color: { value: "#3b82f6" },
                    shape: { type: "circle" },
                    opacity: { value: 0.5, random: true },
                    size: { value: 3, random: true },
                    line_linked: { enable: true, distance: 150, color: "#3b82f6", opacity: 0.4, width: 1 },
                    move: { enable: true, speed: 2, direction: "none", random: true, straight: false, out_mode: "out" }
                },
                interactivity: {
                    detect_on: "canvas",
                    events: {
                        onhover: { enable: true, mode: "repulse" },
                        onclick: { enable: true, mode: "push" }
                    }
                }
            });

            // 模拟服务状态数据
            const sampleServices = [
                {
                    name: "身份认证服务",
                    status: "running",
                    uptime: "5天12小时",
                    cpu: "12%",
                    memory: "256 MB",
                    lastCheck: "刚刚",
                    port: 8080
                },
                {
                    name: "数据加密服务",
                    status: "running",
                    uptime: "5天12小时",
                    cpu: "8%",
                    memory: "192 MB",
                    lastCheck: "刚刚",
                    port: 8081
                },
                {
                    name: "审计日志服务",
                    status: "running",
                    uptime: "5天12小时",
                    cpu: "15%",
                    memory: "320 MB",
                    lastCheck: "刚刚",
                    port: 8082
                },
                {
                    name: "备份服务",
                    status: "running",
                    uptime: "5天12小时",
                    cpu: "5%",
                    memory: "128 MB",
                    lastCheck: "刚刚",
                    port: 8083
                },
                {
                    name: "数据库服务",
                    status: "running",
                    uptime: "5天12小时",
                    cpu: "22%",
                    memory: "1.2 GB",
                    lastCheck: "刚刚",
                    port: 5432
                },
                {
                    name: "监控服务",
                    status: "running",
                    uptime: "5天12小时",
                    cpu: "18%",
                    memory: "512 MB",
                    lastCheck: "刚刚",
                    port: 8084
                }
            ];

            // 模拟告警数据
            const sampleAlerts = [
                {
                    id: 1,
                    level: "warning",
                    message: "数据库服务CPU使用率超过80%",
                    time: "2025-05-28 14:30:22",
                    service: "数据库服务",
                    resolved: false
                },
                {
                    id: 2,
                    level: "error",
                    message: "备份服务磁盘空间不足",
                    time: "2025-05-28 10:15:45",
                    service: "备份服务",
                    resolved: true
                },
                {
                    id: 3,
                    level: "info",
                    message: "身份认证服务重启完成",
                    time: "2025-05-28 08:05:12",
                    service: "身份认证服务",
                    resolved: true
                }
            ];

            // 渲染服务状态表格
            function renderServicesTable() {
                const tableBody = document.getElementById('services-table-body');
                tableBody.innerHTML = '';

                sampleServices.forEach(service => {
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-gray-700 transition';
                    row.innerHTML = `
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="flex items-center">
                                <div class="text-sm font-medium text-white">${service.name}</div>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="status-indicator ${service.status === 'running' ? 'bg-green-500' : 'bg-red-500'}"></span>
                            <span class="text-sm ${service.status === 'running' ? 'text-green-400' : 'text-red-400'}">${service.status === 'running' ? '运行中' : '已停止'}</span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">${service.uptime}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">${service.cpu}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">${service.memory}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">${service.lastCheck}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button class="text-blue-400 hover:text-blue-300 mr-3" onclick="alert('正在开发中：服务详情功能')">详情</button>
                            <button class="text-gray-400 hover:text-gray-300" disabled>重启</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            }

            // 渲染告警列表
            function renderAlertsList() {
                const alertsList = document.getElementById('alerts-list');
                alertsList.innerHTML = '';

                sampleAlerts.forEach(alert => {
                    const alertItem = document.createElement('div');
                    alertItem.className = 'p-4 hover:bg-gray-700 transition';
                    alertItem.innerHTML = `
                        <div class="flex items-start">
                            <div class="flex-shrink-0 pt-1">
                                <span class="status-indicator ${alert.level === 'error' ? 'bg-red-500' : alert.level === 'warning' ? 'bg-yellow-500' : 'bg-blue-500'}"></span>
                            </div>
                            <div class="ml-3 flex-1">
                                <div class="flex justify-between">
                                    <p class="text-sm font-medium ${alert.level === 'error' ? 'text-red-400' : alert.level === 'warning' ? 'text-yellow-400' : 'text-blue-400'}">
                                        ${alert.service} - ${alert.level === 'error' ? '错误' : alert.level === 'warning' ? '警告' : '信息'}
                                    </p>
                                    <p class="text-xs text-gray-400">${alert.time}</p>
                                </div>
                                <p class="text-sm text-gray-300 mt-1">${alert.message}</p>
                                ${alert.resolved ? 
                                    '<p class="text-xs text-green-400 mt-1">已解决</p>' : 
                                    '<button class="mt-2 px-3 py-1 bg-blue-600 text-xs rounded-md hover:bg-blue-700 transition">标记为已解决</button>'
                                }
                            </div>
                        </div>
                    `;
                    alertsList.appendChild(alertItem);
                });
            }

            // 初始化图表
            function initCharts() {
                // CPU使用率图表
                const cpuCtx = document.getElementById('cpu-chart').getContext('2d');
                const cpuChart = new Chart(cpuCtx, {
                    type: 'line',
                    data: {
                        labels: Array.from({length: 12}, (_, i) => `${i*5}分钟前`).reverse(),
                        datasets: [{
                            label: 'CPU使用率',
                            data: [15, 18, 22, 20, 25, 23, 28, 25, 22, 20, 18, 16],
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            borderWidth: 2,
                            tension: 0.3,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                max: 100,
                                grid: {
                                    color: 'rgba(255, 255, 255, 0.1)'
                                },
                                ticks: {
                                    color: '#9CA3AF'
                                }
                            },
                            x: {
                                grid: {
                                    display: false
                                },
                                ticks: {
                                    color: '#9CA3AF'
                                }
                            }
                        }
                    }
                });

                // 内存使用图表
                const memoryCtx = document.getElementById('memory-chart').getContext('2d');
                const memoryChart = new Chart(memoryCtx, {
                    type: 'line',
                    data: {
                        labels: Array.from({length: 12}, (_, i) => `${i*5}分钟前`).reverse(),
                        datasets: [{
                            label: '内存使用 (MB)',
                            data: [3800, 3900, 4000, 4100, 4200, 4300, 4200, 4100, 4000, 3900, 3800, 3700],
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            borderWidth: 2,
                            tension: 0.3,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                grid: {
                                    color: 'rgba(255, 255, 255, 0.1)'
                                },
                                ticks: {
                                    color: '#9CA3AF'
                                }
                            },
                            x: {
                                grid: {
                                    display: false
                                },
                                ticks: {
                                    color: '#9CA3AF'
                                }
                            }
                        }
                    }
                });
            }

            // 刷新按钮事件
            document.getElementById('refresh-btn').addEventListener('click', function() {
                alert('正在开发中：刷新监控数据');
            });

            // 时间范围按钮事件
            document.querySelectorAll('.time-range-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.time-range-btn').forEach(b => {
                        b.classList.remove('bg-blue-600', 'text-white');
                        b.classList.add('bg-gray-700', 'hover:bg-gray-600');
                    });
                    this.classList.add('bg-blue-600', 'text-white');
                    this.classList.remove('bg-gray-700', 'hover:bg-gray-600');
                    
                    alert(`正在开发中：加载${this.textContent}数据`);
                });
            });

            // 查看全部告警按钮
            document.getElementById('view-all-alerts').addEventListener('click', function() {
                alert('正在开发中：查看全部告警');
            });

            // 初始化
            renderServicesTable();
            renderAlertsList();
            initCharts();

            // 模拟实时更新
            setInterval(() => {
                const cpu = Math.floor(Math.random() * 20) + 15;
                const memory = Math.floor(Math.random() * 500) + 3500;
                const network = (Math.random() * 5 + 10).toFixed(1);
                
                document.getElementById('cpu-usage').textContent = `${cpu}%`;
                document.querySelector('#cpu-usage ~ div > div > div').style.width = `${cpu}%`;
                
                document.getElementById('memory-usage').textContent = `${(memory/1000).toFixed(1)}/${16} GB`;
                document.querySelector('#memory-usage ~ div > div > div').style.width = `${(memory/16000*100).toFixed(2)}%`;
                
                document.getElementById('network-usage').textContent = `${network} Mbps`;
                document.querySelector('#network-usage ~ div > div > div').style.width = `${(parseFloat(network)/40*100).toFixed(2)}%`;
            }, 3000);
        });
    </script>
</body>
</html>
