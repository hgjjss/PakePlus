
<!-- public_employment_service_platform_8683/frontend/modules/visualization.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>数据可视化 - 公共就业服务平台</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #f8fafc;
        }
        .card {
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }
        .chart-container {
            position: relative;
            height: 400px;
        }
        .filter-input:focus {
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        .action-btn {
            transition: all 0.2s ease;
        }
        .action-btn:hover {
            transform: translateY(-1px);
        }
        .chart-type-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .badge-primary {
            background-color: #6366f1;
            color: white;
        }
        .badge-secondary {
            background-color: #10b981;
            color: white;
        }
        .badge-warning {
            background-color: #f59e0b;
            color: white;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            color: white;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #4338ca, #2563eb);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(79, 70, 229, 0.3);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn-secondary {
            background: white;
            color: #4f46e5;
            border: 1px solid #4f46e5;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-secondary:hover {
            background: #f9fafb;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(79, 70, 229, 0.15);
        }
        .ripple {
            position: relative;
            overflow: hidden;
        }
        .ripple:after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            transition: 0s;
        }
        .ripple:active:after {
            transform: translate(-50%, -50%) scale(20);
            opacity: 0;
            transition: all 0.6s ease;
        }
        .search-btn {
            min-width: 120px;
            position: relative;
        }
        .search-btn:hover i {
            animation: search-pulse 1s ease infinite;
        }
        @keyframes search-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="flex">
        <!-- 侧边栏 -->
        <div class="hidden md:block">
            <!-- 侧边栏内容由dashboard.html加载 -->
        </div>

        <!-- 主内容区 -->
        <div class="flex-1 p-6">
            <!-- 面包屑导航 -->
            <div class="flex items-center text-sm text-gray-600 mb-6">
                <a href="../dashboard.html" class="hover:text-blue-500">仪表盘</a>
                <span class="mx-2">/</span>
                <span class="text-gray-800 font-medium">数据可视化</span>
            </div>

            <!-- 标题和操作按钮 -->
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800">数据可视化分析</h1>
                <div class="flex space-x-3">
                    <div class="dropdown relative">
                        <button id="exportDropdown" class="btn-primary ripple px-4 py-2 rounded-lg flex items-center space-x-2">
                            <i class="fas fa-file-export"></i>
                            <span>导出</span>
                            <i class="fas fa-chevron-down text-xs ml-1"></i>
                        </button>
                        <div id="exportOptions" class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg hidden z-10">
                            <div class="py-1">
                                <button id="exportPNG" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 w-full text-left">
                                    <i class="fas fa-file-image mr-2"></i>导出为PNG
                                </button>
                                <button id="exportPDF" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 w-full text-left">
                                    <i class="fas fa-file-pdf mr-2"></i>导出为PDF
                                </button>
                                <button id="exportCSV" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 w-full text-left">
                                    <i class="fas fa-file-csv mr-2"></i>导出数据(CSV)
                                </button>
                            </div>
                        </div>
                    </div>
                    <button id="refreshBtn" class="btn-primary ripple flex items-center px-4 py-2 rounded-lg">
                        <i class="fas fa-sync-alt mr-2"></i>
                        <span>刷新</span>
                    </button>
                    <button id="newChartBtn" class="btn-primary ripple flex items-center px-4 py-2 rounded-lg">
                        <i class="fas fa-plus mr-2"></i>
                        <span>新建图表</span>
                    </button>
                </div>
            </div>

            <!-- 图表类型选择 -->
            <div class="bg-white rounded-xl p-4 mb-6 card">
                <div class="flex flex-wrap items-center gap-3">
                    <span class="text-sm font-medium text-gray-700">图表类型:</span>
                    <button class="chart-type-badge badge-primary" data-type="line">
                        <i class="fas fa-chart-line mr-1"></i>折线图
                    </button>
                    <button class="chart-type-badge badge-secondary" data-type="bar">
                        <i class="fas fa-chart-bar mr-1"></i>柱状图
                    </button>
                    <button class="chart-type-badge badge-warning" data-type="pie">
                        <i class="fas fa-chart-pie mr-1"></i>饼图
                    </button>
                    <button class="chart-type-badge badge-primary" data-type="doughnut">
                        <i class="fas fa-chart-pie mr-1"></i>环形图
                    </button>
                    <button class="chart-type-badge badge-secondary" data-type="scatter">
                        <i class="fas fa-chart-scatter mr-1"></i>散点图
                    </button>
                    <button class="chart-type-badge badge-warning" data-type="heatmap">
                        <i class="fas fa-th mr-1"></i>热力图
                    </button>
                </div>
            </div>

            <!-- 时间筛选 -->
            <div class="bg-white rounded-xl p-4 mb-6 card">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div>
                        <label for="dateRange" class="block text-sm font-medium text-gray-700">时间范围</label>
                        <select id="dateRange" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md">
                            <option value="today">今日</option>
                            <option value="week" selected>本周</option>
                            <option value="month">本月</option>
                            <option value="quarter">本季度</option>
                            <option value="year">本年</option>
                            <option value="custom">自定义</option>
                        </select>
                    </div>
                    <div id="customDateRange" class="hidden md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label for="startDate" class="block text-sm font-medium text-gray-700">开始日期</label>
                            <input type="date" id="startDate" class="filter-input mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        </div>
                        <div>
                            <label for="endDate" class="block text-sm font-medium text-gray-700">结束日期</label>
                            <input type="date" id="endDate" class="filter-input mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                        </div>
                    </div>
                    <div>
                        <label for="dataType" class="block text-sm font-medium text-gray-700">数据类型</label>
                        <select id="dataType" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md">
                            <option value="registration">参保登记</option>
                            <option value="payment">缴费记录</option>
                            <option value="exception">异常处理</option>
                            <option value="finance">财务数据</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 图表展示区域 -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- 参保人数趋势 -->
                <div class="card bg-white rounded-xl p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-semibold">参保人数趋势</h3>
                        <div class="flex space-x-2">
                            <button class="text-blue-500 hover:text-blue-700 action-btn">
                                <i class="fas fa-cog"></i>
                            </button>
                            <button class="export-chart-btn text-blue-500 hover:text-blue-700 action-btn" data-chart-id="trendChart">
                                <i class="fas fa-download"></i>
                            </button>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>

                <!-- 业务类型分布 -->
                <div class="card bg-white rounded-xl p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-semibold">业务类型分布</h3>
                        <div class="flex space-x-2">
                            <button class="text-blue-500 hover:text-blue-700 action-btn">
                                <i class="fas fa-cog"></i>
                            </button>
                            <button class="export-chart-btn text-blue-500 hover:text-blue-700 action-btn" data-chart-id="pieChart">
                                <i class="fas fa-download"></i>
                            </button>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="pieChart"></canvas>
                    </div>
                </div>

                <!-- 缴费金额统计 -->
                <div class="card bg-white rounded-xl p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-semibold">缴费金额统计</h3>
                        <div class="flex space-x-2">
                            <button class="text-blue-500 hover:text-blue-700 action-btn">
                                <i class="fas fa-cog"></i>
                            </button>
                            <button class="export-chart-btn text-blue-500 hover:text-blue-700 action-btn" data-chart-id="barChart">
                                <i class="fas fa-download"></i>
                            </button>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>

                <!-- 异常类型分布 -->
                <div class="card bg-white rounded-xl p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-semibold">异常类型分布</h3>
                        <div class="flex space-x-2">
                            <button class="text-blue-500 hover:text-blue-700 action-btn">
                                <i class="fas fa-cog"></i>
                            </button>
                            <button class="export-chart-btn text-blue-500 hover:text-blue-700 action-btn" data-chart-id="doughnutChart">
                                <i class="fas fa-download"></i>
                            </button>
                        </div>
                    </div>
                    <div class="chart-container">
                        <canvas id="doughnutChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- 自定义图表配置区域 -->
            <div class="bg-white rounded-xl p-6 mt-6 card">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold">自定义图表配置</h3>
                    <button id="addChartBtn" class="btn-primary ripple px-4 py-2 rounded-lg">
                        <i class="fas fa-plus mr-2"></i>添加图表
                    </button>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6" id="customChartsContainer">
                    <!-- 动态添加的自定义图表将显示在这里 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 新建图表模态框 -->
    <div id="newChartModal" class="fixed z-10 inset-0 overflow-y-auto hidden">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 transition-opacity" aria-hidden="true">
                <div class="absolute inset-0 bg-gray-500 opacity-75"></div>
            </div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-2xl sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
                            <h3 class="text-lg leading-6 font-medium text-gray-900 mb-6">新建自定义图表</h3>
                            <form class="space-y-4">
                                <div>
                                    <label for="chartTitle" class="block text-sm font-medium text-gray-700">图表标题</label>
                                    <input type="text" id="chartTitle" class="mt-1 focus:ring-blue-500 focus:border-blue-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md" placeholder="例如: 参保人数月度趋势">
                                </div>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label for="chartType" class="block text-sm font-medium text-gray-700">图表类型</label>
                                        <select id="chartType" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md">
                                            <option value="line">折线图</option>
                                            <option value="bar">柱状图</option>
                                            <option value="pie">饼图</option>
                                            <option value="doughnut">环形图</option>
                                            <option value="scatter">散点图</option>
                                            <option value="heatmap">热力图</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label for="dataSource" class="block text-sm font-medium text-gray-700">数据源</label>
                                        <select id="dataSource" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md">
                                            <option value="registration">参保登记数据</option>
                                            <option value="payment">缴费数据</option>
                                            <option value="exception">异常数据</option>
                                            <option value="finance">财务数据</option>
                                        </select>
                                    </div>
                                </div>
                                <div>
                                    <label for="chartDescription" class="block text-sm font-medium text-gray-700">图表描述</label>
                                    <textarea id="chartDescription" rows="3" class="mt-1 focus:ring-blue-500 focus:border-blue-500 block w-full shadow-sm sm:text-sm border-gray-300 rounded-md" placeholder="简要描述此图表的用途和内容"></textarea>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">显示选项</label>
                                    <div class="mt-2 space-y-2">
                                        <div class="flex items-center">
                                            <input id="showLegend" name="showLegend" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" checked>
                                            <label for="showLegend" class="ml-2 block text-sm text-gray-700">显示图例</label>
                                        </div>
                                        <div class="flex items-center">
                                            <input id="showLabels" name="showLabels" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" checked>
                                            <label for="showLabels" class="ml-2 block text-sm text-gray-700">显示数据标签</label>
                                        </div>
                                        <div class="flex items-center">
                                            <input id="animateChart" name="animateChart" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" checked>
                                            <label for="animateChart" class="ml-2 block text-sm text-gray-700">启用动画效果</label>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" id="confirmNewChart" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-500 text-base font-medium text-white hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:ml-3 sm:w-auto sm:text-sm">
                        创建图表
                    </button>
                    <button type="button" id="cancelNewChart" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                        取消
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.1/chart.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 检查登录状态
            if (!sessionStorage.getItem('isLoggedIn')) {
                window.location.href = '../index.html';
                return;
            }

            // 导出下拉菜单
            const exportDropdown = document.getElementById('exportDropdown');
            const exportOptions = document.getElementById('exportOptions');
            
            exportDropdown.addEventListener('click', function() {
                exportOptions.classList.toggle('hidden');
            });
            
            // 点击外部关闭导出下拉菜单
            document.addEventListener('click', function(event) {
                if (!exportDropdown.contains(event.target) && !exportOptions.contains(event.target)) {
                    exportOptions.classList.add('hidden');
                }
            });

            // 导出选项
            document.getElementById('exportPNG').addEventListener('click', function() {
                alert('导出PNG功能正在开发中');
                exportOptions.classList.add('hidden');
            });
            
            document.getElementById('exportPDF').addEventListener('click', function() {
                alert('导出PDF功能正在开发中');
                exportOptions.classList.add('hidden');
            });
            
            document.getElementById('exportCSV').addEventListener('click', function() {
                alert('导出CSV功能正在开发中');
                exportOptions.classList.add('hidden');
            });

            // 时间范围选择
            const dateRange = document.getElementById('dateRange');
            const customDateRange = document.getElementById('customDateRange');
            
            dateRange.addEventListener('change', function() {
                if (this.value === 'custom') {
                    customDateRange.classList.remove('hidden');
                } else {
                    customDateRange.classList.add('hidden');
                }
            });

            // 图表类型选择
            document.querySelectorAll('.chart-type-badge').forEach(badge => {
                badge.addEventListener('click', function() {
                    // 移除所有选中状态
                    document.querySelectorAll('.chart-type-badge').forEach(b => {
                        b.classList.remove('ring-2', 'ring-offset-2', 'ring-blue-500');
                    });
                    // 添加当前选中状态
                    this.classList.add('ring-2', 'ring-offset-2', 'ring-blue-500');
                    
                    // 获取图表类型
                    const chartType = this.dataset.type;
                    console.log('选择图表类型:', chartType);
                });
            });

            // 初始化图表
            const trendCtx = document.getElementById('trendChart').getContext('2d');
            const pieCtx = document.getElementById('pieChart').getContext('2d');
            const barCtx = document.getElementById('barChart').getContext('2d');
            const doughnutCtx = document.getElementById('doughnutChart').getContext('2d');

            // 趋势图
            const trendChart = new Chart(trendCtx, {
                type: 'line',
                data: {
                    labels: ['1月', '2月', '3月', '4月', '5月', '6月'],
                    datasets: [{
                        label: '新增参保人数',
                        data: [320, 450, 380, 520, 480, 510],
                        backgroundColor: 'rgba(99, 102, 241, 0.2)',
                        borderColor: 'rgba(99, 102, 241, 1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });

            // 饼图
            const pieChart = new Chart(pieCtx, {
                type: 'pie',
                data: {
                    labels: ['参保登记', '缴费业务', '信息变更', '待遇申领', '其他'],
                    datasets: [{
                        data: [35, 25, 20, 15, 5],
                        backgroundColor: [
                            'rgba(99, 102, 241, 0.7)',
                            'rgba(16, 185, 129, 0.7)',
                            'rgba(245, 158, 11, 0.7)',
                            'rgba(239, 68, 68, 0.7)',
                            'rgba(156, 163, 175, 0.7)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                        }
                    }
                }
            });

            // 柱状图
            const barChart = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: ['养老保险', '医疗保险', '失业保险', '工伤保险', '生育保险'],
                    datasets: [{
                        label: '缴费金额(元)',
                        data: [1250, 850, 320, 180, 420],
                        backgroundColor: 'rgba(99, 102, 241, 0.7)',
                        borderColor: 'rgba(99, 102, 241, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });

            // 环形图
            const doughnutChart = new Chart(doughnutCtx, {
                type: 'doughnut',
                data: {
                    labels: ['系统异常', '业务异常', '数据异常', '安全异常'],
                    datasets: [{
                        data: [45, 30, 15, 10],
                        backgroundColor: [
                            'rgba(99, 102, 241, 0.7)',
                            'rgba(16, 185, 129, 0.7)',
                            'rgba(245, 158, 11, 0.7)',
                            'rgba(239, 68, 68, 0.7)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                        }
                    }
                }
            });

            // 新建图表模态框
            const newChartBtn = document.getElementById('newChartBtn');
            const newChartModal = document.getElementById('newChartModal');
            const confirmNewChart = document.getElementById('confirmNewChart');
            const cancelNewChart = document.getElementById('cancelNewChart');
            
            newChartBtn.addEventListener('click', function() {
                newChartModal.classList.remove('hidden');
            });
            
            confirmNewChart.addEventListener('click', function() {
                const chartTitle = document.getElementById('chartTitle').value;
                const chartType = document.getElementById('chartType').value;
                const dataSource = document.getElementById('dataSource').value;
                
                if (!chartTitle) {
                    alert('请输入图表标题');
                    return;
                }
                
                // 模拟创建新图表
                console.log('创建新图表:', {
                    title: chartTitle,
                    type: chartType,
                    source: dataSource
                });
                
                // 添加新图表到自定义区域
                addCustomChart(chartTitle, chartType);
                
                newChartModal.classList.add('hidden');
            });
            
            cancelNewChart.addEventListener('click', function() {
                newChartModal.classList.add('hidden');
            });
            
            // 点击模态框外部关闭
            window.addEventListener('click', function(event) {
                if (event.target === newChartModal) {
                    newChartModal.classList.add('hidden');
                }
            });

            // 添加自定义图表
            function addCustomChart(title, type) {
                const chartId = `customChart-${Date.now()}`;
                const chartHtml = `
                    <div class="card bg-white rounded-xl p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-semibold">${title}</h3>
                            <div class="flex space-x-2">
                                <button class="config-chart-btn text-blue-500 hover:text-blue-700 action-btn" data-chart-id="${chartId}">
                                    <i class="fas fa-cog"></i>
                                </button>
                                <button class="export-chart-btn text-blue-500 hover:text-blue-700 action-btn" data-chart-id="${chartId}">
                                    <i class="fas fa-download"></i>
                                </button>
                                <button class="remove-chart-btn text-red-500 hover:text-red-700 action-btn" data-chart-id="${chartId}">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <div class="chart-container">
                            <canvas id="${chartId}"></canvas>
                        </div>
                    </div>
                `;
                
                document.getElementById('customChartsContainer').insertAdjacentHTML('beforeend', chartHtml);
                
                // 初始化新图表
                const ctx = document.getElementById(chartId).getContext('2d');
                let chartData;
                
                switch(type) {
                    case 'line':
                        chartData = {
                            labels: ['1月', '2月', '3月', '4月', '5月', '6月'],
                            datasets: [{
                                label: '数据趋势',
                                data: [320, 450, 380, 520, 480, 510],
                                backgroundColor: 'rgba(99, 102, 241, 0.2)',
                                borderColor: 'rgba(99, 102, 241, 1)',
                                borderWidth: 2,
                                tension: 0.4,
                                fill: true
                            }]
                        };
                        break;
                    case 'bar':
                        chartData = {
                            labels: ['项目1', '项目2', '项目3', '项目4', '项目5'],
                            datasets: [{
                                label: '数据值',
                                data: [125, 85, 32, 18, 42],
                                backgroundColor: 'rgba(99, 102, 241, 0.7)',
                                borderColor: 'rgba(99, 102, 241, 1)',
                                borderWidth: 1
                            }]
                        };
                        break;
                    case 'pie':
                        chartData = {
                            labels: ['类别1', '类别2', '类别3', '类别4'],
                            datasets: [{
                                data: [35, 25, 20, 20],
                                backgroundColor: [
                                    'rgba(99, 102, 241, 0.7)',
                                    'rgba(16, 185, 129, 0.7)',
                                    'rgba(245, 158, 11, 0.7)',
                                    'rgba(239, 68, 68, 0.7)'
                                ],
                                borderWidth: 1
                            }]
                        };
                        break;
                    case 'doughnut':
                        chartData = {
                            labels: ['类别A', '类别B', '类别C', '类别D'],
                            datasets: [{
                                data: [45, 30, 15, 10],
                                backgroundColor: [
                                    'rgba(99, 102, 241, 0.7)',
                                    'rgba(16, 185, 129, 0.7)',
                                    'rgba(245, 158, 11, 0.7)',
                                    'rgba(239, 68, 68, 0.7)'
                                ],
                                borderWidth: 1
                            }]
                        };
                        break;
                    default:
                        chartData = {
                            labels: ['数据1', '数据2', '数据3', '数据4', '数据5'],
                            datasets: [{
                                label: '数据值',
                                data: [125, 85, 32, 18, 42],
                                backgroundColor: 'rgba(99, 102, 241, 0.7)',
                                borderColor: 'rgba(99, 102, 241, 1)',
                                borderWidth: 1
                            }]
                        };
                }
                
                new Chart(ctx, {
                    type: type,
                    data: chartData,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'right',
                            }
                        }
                    }
                });
                
                // 绑定导出按钮事件
                document.querySelectorAll('.export-chart-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const chartId = this.dataset.chartId;
                        alert(`导出图表 ${chartId} 功能正在开发中`);
                    });
                });
                
                // 绑定删除按钮事件
                document.querySelectorAll('.remove-chart-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const chartId = this.dataset.chartId;
                        if (confirm('确定要删除此图表吗？')) {
                            document.getElementById(chartId).closest('.card').remove();
                        }
                    });
                });
            }

            // 刷新按钮
            const refreshBtn = document.getElementById('refreshBtn');
            refreshBtn.addEventListener('click', function() {
                // 模拟刷新数据
                console.log('刷新图表数据');
                this.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>刷新中';
                setTimeout(() => {
                    this.innerHTML = '<i class="fas fa-sync-alt mr-2"></i>刷新';
                    alert('图表数据已刷新');
                }, 1000);
            });

            // 添加图表按钮
            const addChartBtn = document.getElementById('addChartBtn');
            addChartBtn.addEventListener('click', function() {
                newChartModal.classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
