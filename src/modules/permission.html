<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>权限管理 - 公共就业服务平台</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #f8fafc;
        }
        .card {
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
        }
        .permission-tree {
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 1rem;
            max-height: 500px;
            overflow-y: auto;
        }
        .role-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .role-admin {
            background-color: #6366f1;
            color: white;
        }
        .role-manager {
            background-color: #10b981;
            color: white;
        }
        .role-operator {
            background-color: #3b82f6;
            color: white;
        }
        .role-auditor {
            background-color: #f59e0b;
            color: white;
        }
        .filter-input:focus {
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        .action-btn {
            transition: all 0.2s ease;
        }
        .action-btn:hover {
            transform: translateY(-1px);
        }
        .tree-node {
            padding-left: 1.5rem;
            position: relative;
        }
        .tree-node::before {
            content: '';
            position: absolute;
            left: 0.5rem;
            top: 0;
            bottom: 0;
            width: 1px;
            background-color: #e2e8f0;
        }
        .tree-node-toggle {
            position: absolute;
            left: 0;
            top: 0.25rem;
            width: 1rem;
            height: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #64748b;
        }
        .tree-node-toggle:hover {
            color: #334155;
        }
        .tree-node-content {
            display: flex;
            align-items: center;
            padding: 0.25rem 0;
        }
        .tree-node-checkbox {
            margin-right: 0.5rem;
        }
        .tree-node-icon {
            margin-right: 0.5rem;
            color: #64748b;
        }
        .tree-node-label {
            flex-grow: 1;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #10b981;
        }
        input:checked + .slider:before {
            transform: translateX(26px);
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .btn-secondary {
            background: #fff;
            color: #4f46e5;
            border: 1px solid #4f46e5;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            background: #f5f5ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            transition: all 0.3s ease;
        }
        .btn-danger:hover {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }
        .ripple {
            position: relative;
            overflow: hidden;
        }
        .ripple::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            opacity: 0;
            border-radius: 100%;
            transform: scale(1, 1) translate(-50%, -50%);
            transform-origin: 50% 50%;
        }
        .ripple:focus:not(:active)::after {
            animation: ripple 1s ease-out;
        }
        @keyframes ripple {
            0% {
                transform: scale(0, 0);
                opacity: 0.5;
            }
            100% {
                transform: scale(100, 100);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

                        保存

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 检查登录状态
            if (!sessionStorage.getItem('isLoggedIn')) {
                window.location.href = '../index.html';
                return;
            }

            // 权限树交互
            document.querySelectorAll('.tree-node-toggle').forEach(toggle => {
                toggle.addEventListener('click', function() {
                    const children = this.parentElement.querySelector('.tree-node-children');
                    const icon = this.querySelector('i');
                    
                    if (children.classList.contains('hidden')) {
                        children.classList.remove('hidden');
                        icon.classList.remove('fa-chevron-right');
                        icon.classList.add('fa-chevron-down');
                    } else {
                        children.classList.add('hidden');
                        icon.classList.remove('fa-chevron-down');
                        icon.classList.add('fa-chevron-right');
                    }
                });
            });

            // 角色选择变化
            const roleSelect = document.getElementById('roleSelect');
            roleSelect.addEventListener('change', function() {
                if (this.value) {
                    // 模拟加载角色权限
                    console.log(`加载 ${this.options[this.selectedIndex].text} 的权限`);
                }
            });

            // 保存权限
            const savePermissions = document.getElementById('savePermissions');
            savePermissions.addEventListener('click', function() {
                const role = roleSelect.value;
                if (!role) {
                    alert('请先选择角色');
                    return;
                }
                
                // 模拟保存权限
                console.log(`保存 ${roleSelect.options[roleSelect.selectedIndex].text} 的权限`);
                alert('权限保存成功');
            });

            // 新增角色
            const newRoleBtn = document.getElementById('newRoleBtn');
            const newRoleModal = document.getElementById('newRoleModal');
            const cancelNewRole = document.getElementById('cancelNewRole');
            
            newRoleBtn.addEventListener('click', function() {
                newRoleModal.classList.remove('hidden');
            });
            
            cancelNewRole.addEventListener('click', function() {
                newRoleModal.classList.add('hidden');
            });
            
            // 点击模态框外部关闭
            window.addEventListener('click', function(event) {
                if (event.target === newRoleModal) {
                    newRoleModal.classList.add('hidden');
                }
            });

            // 新增用户
            const newUserBtn = document.getElementById('newUserBtn');
            const newUserModal = document.getElementById('newUserModal');
            const cancelNewUser = document.getElementById('cancelNewUser');
            const userStatus = document.getElementById('userStatus');
            const statusLabel = document.getElementById('statusLabel');
            
            newUserBtn.addEventListener('click', function() {
                newUserModal.classList.remove('hidden');
            });
            
            cancelNewUser.addEventListener('click', function() {
                newUserModal.classList.add('hidden');
            });

            // 用户状态切换
            userStatus.addEventListener('change', function() {
                statusLabel.textContent = this.checked ? '启用' : '禁用';
            });
            
            // 点击模态框外部关闭
            window.addEventListener('click', function(event) {
                if (event.target === newUserModal) {
                    newUserModal.classList.add('hidden');
                }
            });

            // 导出功能
            const exportBtn = document.getElementById('exportBtn');
            exportBtn.addEventListener('click', function() {
                // 模拟导出数据
                const data = [
                    { role: '系统管理员', code: 'admin', userCount: 3, description: '拥有系统所有权限' },
                    { role: '业务经理', code: 'manager', userCount: 5, description: '拥有业务管理权限' },
                    { role: '操作员', code: 'operator', userCount: 12, description: '拥有基本操作权限' }
                ];
                
                // 调用全局导出方法
                if (window.exportData) {
                    window.exportData(data, 'csv', '角色权限数据');
                } else {
                    alert('导出功能正在开发中');
                }
            });

            // 导入功能
            const importBtn = document.getElementById('importBtn');
            importBtn.addEventListener('click', function() {
                alert('导入功能正在开发中');
            });

            // 搜索功能
            const roleSearch = document.getElementById('roleSearch');
            const userSearch = document.getElementById('userSearch');
            
            roleSearch.addEventListener('input', function() {
                const term = this.value.toLowerCase();
                document.querySelectorAll('#roleTableBody tr').forEach(row => {
                    const name = row.querySelector('td:nth-child(1)').textContent.toLowerCase();
                    const desc = row.querySelector('td:nth-child(3)').textContent.toLowerCase();
                    row.style.display = name.includes(term) || desc.includes(term) ? '' : 'none';
                });
            });
            
            userSearch.addEventListener('input', function() {
                const term = this.value.toLowerCase();
                document.querySelectorAll('#userTableBody tr').forEach(row => {
                    const name = row.querySelector('td:nth-child(1) div:nth-child(1)').textContent.toLowerCase();
                    const email = row.querySelector('td:nth-child(1) div:nth-child(2)').textContent.toLowerCase();
                    row.style.display = name.includes(term) || email.includes(term) ? '' : 'none';
                });
            });
        });
    </script>
</body>
</html>
