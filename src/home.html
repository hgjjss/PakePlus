
<!-- video_monitoring_replay_service/frontend/home.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>监控视频数字化回放服务软件- 主界面</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.loli.net/css?family=Noto+Sans+SC:400,500,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
        }
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        .main-container {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .video-container {
            aspect-ratio: 16/9;
            background: #000;
        }
        .control-btn {
            transition: all 0.2s ease;
        }
        .control-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.2);
        }
        .nav-item {
            transition: all 0.2s ease;
        }
        .nav-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .device-status {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .device-online {
            background-color: #10b981;
            box-shadow: 0 0 6px #10b981;
        }
        .device-offline {
            background-color: #ef4444;
        }
        .analysis-alert {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body class="text-white">
    <div class="particles" id="particles-js"></div>
    
    <div class="container mx-auto px-4 py-6 relative z-10">
        <!-- 顶部导航 -->
        <div class="main-container rounded-xl p-4 mb-6 flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center">
                <span class="mr-2">📹</span>监控视频数字化回放服务软件
            </h1>
            <div class="flex items-center space-x-4">
                <div class="text-sm bg-gray-700 px-3 py-1 rounded-full">
                    <span class="device-status device-online"></span>
                    <span>系统运行中</span>
                </div>
                <button id="logoutBtn" class="px-4 py-2 rounded-lg bg-red-500 hover:bg-red-600 transition">
                    退出登录
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <!-- 侧边栏 -->
            <div class="main-container rounded-xl p-4 lg:col-span-1">
                <div class="space-y-2">
                    <div class="nav-item p-3 rounded-lg cursor-pointer bg-blue-600">
                        <span class="mr-2">🎥</span> 实时监控
                    </div>
                    <div id="searchBtn" class="nav-item p-3 rounded-lg cursor-pointer hover:bg-blue-500">
                        <span class="mr-2">🔍</span> 录像查询
                    </div>
                    <div id="analysisBtn" class="nav-item p-3 rounded-lg cursor-pointer hover:bg-blue-500">
                        <span class="mr-2">📊</span> 智能分析
                        <span class="text-xs ml-2 px-2 py-1 bg-yellow-500 rounded-full">新功能</span>
                    </div>
                    <div id="settingsBtn" class="nav-item p-3 rounded-lg cursor-pointer hover:bg-blue-500">
                        <span class="mr-2">⚙️</span> 系统设置
                    </div>
                </div>

                <div class="mt-8">
                    <h3 class="font-medium mb-3 flex justify-between items-center">
                        <span>监控设备列表</span>
                        <span class="text-xs text-gray-400">3/3在线</span>
                    </h3>
                    <div class="space-y-2">
                        <div id="frontCameraBtn" class="nav-item p-2 rounded-lg cursor-pointer bg-blue-500">
                            <span class="device-status device-online"></span>
                            <span class="mr-2">🚗</span> 车辆前摄像头
                        </div>
                        <div id="doorCameraBtn" class="nav-item p-2 rounded-lg cursor-pointer hover:bg-blue-500">
                            <span class="device-status device-online"></span>
                            <span class="mr-2">🚪</span> 车门监控
                        </div>
                        <div id="insideCameraBtn" class="nav-item p-2 rounded-lg cursor-pointer hover:bg-blue-500">
                            <span class="device-status device-online"></span>
                            <span class="mr-2">👥</span> 车内监控
                        </div>
                    </div>
                </div>

                <div class="mt-8">
                    <h3 class="font-medium mb-3">智能分析事件</h3>
                    <div class="space-y-2">
                        <div class="analysis-alert p-2 rounded-lg bg-red-500/20 border-l-4 border-red-500">
                            <div class="text-sm font-medium">移动物体检测</div>
                            <div class="text-xs text-gray-400">前摄像头 · 2分钟前</div>
                        </div>
                        <div class="analysis-alert p-2 rounded-lg bg-yellow-500/20 border-l-4 border-yellow-500">
                            <div class="text-sm font-medium">异常行为</div>
                            <div class="text-xs text-gray-400">车内监控 · 15分钟前</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 主内容区 -->
            <div class="lg:col-span-3 space-y-6">
                <!-- 视频监控区 -->
                <div class="main-container rounded-xl p-4">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-medium">实时监控画面</h2>
                        <div class="flex space-x-2">
                            <button class="px-3 py-1 text-sm rounded bg-blue-600 hover:bg-blue-700">
                                <span class="mr-1">🔄</span> 刷新
                            </button>
                            <button class="px-3 py-1 text-sm rounded bg-gray-600 hover:bg-gray-700">
                                <span class="mr-1">📷</span> 截图
                            </button>
                        </div>
                    </div>
                    <div class="video-container rounded-lg overflow-hidden relative">
                        <video id="monitorVideo" class="w-full h-full" poster="https://picsum.photos/1280/720?random=1">
                            <source src="https://samplelib.com/lib/preview/mp4/sample-5s.mp4" type="video/mp4">
                            您的浏览器不支持视频播放
                        </video>
                        <div class="absolute bottom-4 left-4 bg-black/50 px-3 py-1 rounded text-sm">
                            <span class="device-status device-online"></span>
                            <span>车辆前摄像头 · 实时</span>
                        </div>
                    </div>
                </div>

                <!-- 回放控制区 -->
                <div class="main-container rounded-xl p-4">
                    <h2 class="text-xl font-medium mb-4">回放控制</h2>
                    <div class="flex flex-wrap items-center justify-between">
                        <div class="flex space-x-2 mb-4 md:mb-0">
                            <button id="playBtn" class="control-btn w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center">
                                ▶️
                            </button>
                            <button id="pauseBtn" class="control-btn w-12 h-12 rounded-full bg-gray-600 flex items-center justify-center">
                                ⏸️
                            </button>
                            <button id="stopBtn" class="control-btn w-12 h-12 rounded-full bg-gray-600 flex items-center justify-center">
                                ⏹️
                            </button>
                        </div>

                        <div class="flex items-center space-x-2 w-full md:w-auto">
                            <button id="slowBtn" class="control-btn px-4 py-2 rounded-lg bg-gray-600">
                                慢速 (0.5x)
                            </button>
                            <button id="normalBtn" class="control-btn px-4 py-2 rounded-lg bg-blue-600">
                                正常 (1.0x)
                            </button>
                            <button id="fastBtn" class="control-btn px-4 py-2 rounded-lg bg-gray-600">
                                快速 (2.0x)
                            </button>
                        </div>

                        <div class="flex items-center space-x-2 w-full md:w-auto mt-4 md:mt-0">
                            <button id="prevFrameBtn" class="control-btn px-4 py-2 rounded-lg bg-gray-600">
                                ⏮️ 上一帧
                            </button>
                            <button id="nextFrameBtn" class="control-btn px-4 py-2 rounded-lg bg-gray-600">
                                ⏭️ 下一帧
                            </button>
                        </div>
                    </div>

                    <div class="mt-4">
                        <div class="flex items-center space-x-4">
                            <span id="currentTime">00:00:00</span>
                            <input id="progressBar" type="range" min="0" max="100" value="0" class="w-full h-2 rounded-lg appearance-none bg-gray-600">
                            <span id="duration">00:00:05</span>
                        </div>
                    </div>

                    <div class="flex justify-end space-x-3 mt-4">
                        <button id="fullscreenBtn" class="control-btn px-4 py-2 rounded-lg bg-gray-600">
                            🖥️ 全屏
                        </button>
                        <button id="downloadBtn" class="control-btn px-4 py-2 rounded-lg bg-green-600">
                            ⬇️ 下载录像
                        </button>
                    </div>
                </div>

                <!-- 智能分析区 -->
                <div id="analysisSection" class="main-container rounded-xl p-4 hidden">
                    <h2 class="text-xl font-medium mb-4">智能分析结果</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-gray-800/50 p-4 rounded-lg">
                            <div class="flex items-center mb-2">
                                <div class="w-3 h-3 rounded-full bg-red-500 mr-2"></div>
                                <h3 class="font-medium">移动物体检测</h3>
                            </div>
                            <div class="text-sm text-gray-400 mb-3">检测到3个移动物体</div>
                            <div class="h-32 bg-black rounded flex items-center justify-center">
                                <span class="text-gray-500">热力图可视化</span>
                            </div>
                        </div>
                        <div class="bg-gray-800/50 p-4 rounded-lg">
                            <div class="flex items-center mb-2">
                                <div class="w-3 h-3 rounded-full bg-yellow-500 mr-2"></div>
                                <h3 class="font-medium">异常行为分析</h3>
                            </div>
                            <div class="text-sm text-gray-400 mb-3">检测到1处异常行为</div>
                            <div class="h-32 bg-black rounded flex items-center justify-center">
                                <span class="text-gray-500">行为轨迹可视化</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 粒子效果初始化
            particlesJS('particles-js', {
                particles: {
                    number: { value: 60, density: { enable: true, value_area: 800 } },
                    color: { value: "#ffffff" },
                    shape: { type: "circle" },
                    opacity: { value: 0.3, random: true },
                    size: { value: 3, random: true },
                    line_linked: { enable: true, distance: 150, color: "#ffffff", opacity: 0.2, width: 1 },
                    move: { enable: true, speed: 1.5, direction: "none", random: true, straight: false, out_mode: "out" }
                }
            });

            // 检查登录状态
            if(localStorage.getItem('isLoggedIn') !== 'true') {
                window.location.href = 'index.html';
            }

            // 退出登录
            document.getElementById('logoutBtn').addEventListener('click', function() {
                localStorage.removeItem('isLoggedIn');
                window.location.href = 'index.html';
            });

            // 导航按钮
            document.getElementById('searchBtn').addEventListener('click', function() {
                window.location.href = 'search.html';
            });

            document.getElementById('analysisBtn').addEventListener('click', function() {
                document.getElementById('analysisSection').classList.toggle('hidden');
            });

            document.getElementById('settingsBtn').addEventListener('click', function() {
                window.location.href = 'settings.html';
            });

            // 摄像头切换
            const cameraButtons = [
                document.getElementById('frontCameraBtn'),
                document.getElementById('doorCameraBtn'),
                document.getElementById('insideCameraBtn')
            ];

            cameraButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    cameraButtons.forEach(b => b.classList.remove('bg-blue-500'));
                    this.classList.add('bg-blue-500');
                    alert('正在开发中：摄像头切换功能');
                });
            });

            // 视频播放器控制
            const video = document.getElementById('monitorVideo');
            const playBtn = document.getElementById('playBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const stopBtn = document.getElementById('stopBtn');
            const slowBtn = document.getElementById('slowBtn');
            const normalBtn = document.getElementById('normalBtn');
            const fastBtn = document.getElementById('fastBtn');
            const prevFrameBtn = document.getElementById('prevFrameBtn');
            const nextFrameBtn = document.getElementById('nextFrameBtn');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const progressBar = document.getElementById('progressBar');
            const currentTime = document.getElementById('currentTime');
            const duration = document.getElementById('duration');

            // 初始化视频
            video.addEventListener('loadedmetadata', function() {
                duration.textContent = formatTime(video.duration);
            });

            // 播放/暂停控制
            playBtn.addEventListener('click', function() {
                video.play();
                playBtn.classList.add('bg-blue-600');
                pauseBtn.classList.remove('bg-blue-600');
            });

            pauseBtn.addEventListener('click', function() {
                video.pause();
                pauseBtn.classList.add('bg-blue-600');
                playBtn.classList.remove('bg-blue-600');
            });

            stopBtn.addEventListener('click', function() {
                video.pause();
                video.currentTime = 0;
                pauseBtn.classList.add('bg-blue-600');
                playBtn.classList.remove('bg-blue-600');
            });

            // 播放速度控制
            slowBtn.addEventListener('click', function() {
                video.playbackRate = 0.5;
                slowBtn.classList.add('bg-blue-600');
                normalBtn.classList.remove('bg-blue-600');
                fastBtn.classList.remove('bg-blue-600');
            });

            normalBtn.addEventListener('click', function() {
                video.playbackRate = 1.0;
                normalBtn.classList.add('bg-blue-600');
                slowBtn.classList.remove('bg-blue-600');
                fastBtn.classList.remove('bg-blue-600');
            });

            fastBtn.addEventListener('click', function() {
                video.playbackRate = 2.0;
                fastBtn.classList.add('bg-blue-600');
                slowBtn.classList.remove('bg-blue-600');
                normalBtn.classList.remove('bg-blue-600');
            });

            // 逐帧控制
            prevFrameBtn.addEventListener('click', function() {
                video.pause();
                video.currentTime = Math.max(0, video.currentTime - 0.1);
            });

            nextFrameBtn.addEventListener('click', function() {
                video.pause();
                video.currentTime = Math.min(video.duration, video.currentTime + 0.1);
            });

            // 全屏控制
            fullscreenBtn.addEventListener('click', function() {
                if (video.requestFullscreen) {
                    video.requestFullscreen();
                } else if (video.webkitRequestFullscreen) {
                    video.webkitRequestFullscreen();
                } else if (video.msRequestFullscreen) {
                    video.msRequestFullscreen();
                }
            });

            // 下载控制
            downloadBtn.addEventListener('click', function() {
                alert('正在开发中：视频下载功能');
            });

            // 进度条更新
            video.addEventListener('timeupdate', function() {
                const progress = (video.currentTime / video.duration) * 100;
                progressBar.value = progress;
                currentTime.textContent = formatTime(video.currentTime);
            });

            progressBar.addEventListener('input', function() {
                const seekTime = (progressBar.value / 100) * video.duration;
                video.currentTime = seekTime;
            });

            // 格式化时间显示
            function formatTime(seconds) {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = Math.floor(seconds % 60);
                return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }
        });
    </script>
</body>
</html>
